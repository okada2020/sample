# XcodeGen 用の定義。
# PreciseOCR.xcodeproj をそのまま開けば使えますが、プロジェクトファイルを作り直したいときは
#   brew install xcodegen && xcodegen generate
# で同じ構成を再生成できます。
name: PreciseOCR
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  PreciseOCR:
    type: application
    platform: iOS
    sources:
      - PreciseOCR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PreciseOCR
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 高精度OCR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 文字を読み取るためにカメラを使用します。撮影した画像は端末内でのみ処理されます。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 保存済みの写真から文字を読み取るために使用します。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
