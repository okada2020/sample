<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec8e3">
<title>フルーツ・クラウドランナー ｜ 坂道を転がせ！</title>
<meta name="description" content="坂道でフルーツを転がし、ゲートをくぐって仲間を増やす。邪魔をするサルを蹴散らして、最後に待ち受けるクマを倒せ！">
<style>
  :root{
    --ui:#0f2027;
    --accent:#ffb020;
    --good:#3ecf7a;
    --bad:#ff5f56;
    --panel:rgba(10,22,30,.82);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1620;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    color:#fff;user-select:none;touch-action:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;max-width:820px;overflow:hidden;
         box-shadow:0 0 60px rgba(0,0,0,.5);}
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;padding:12px 14px;
       padding-top:calc(12px + env(safe-area-inset-top));}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .chip{background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:800;
        font-size:15px;letter-spacing:.02em;backdrop-filter:blur(6px);
        box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;}
  #count{font-size:22px;color:var(--accent);}
  #progress{position:absolute;left:14px;right:14px;top:calc(56px + env(safe-area-inset-top));
            height:8px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;}
  #bar{height:100%;width:0;border-radius:99px;
       background:linear-gradient(90deg,#8de36b,#ffd166);transition:width .12s linear;}
  #goal{position:absolute;right:-2px;top:-7px;font-size:16px;}
  #hint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
        text-align:center;font-size:13px;opacity:.75;text-shadow:0 2px 6px #000;}
  #bossbar{position:absolute;left:14%;right:14%;top:calc(84px + env(safe-area-inset-top));
           display:none;}
  #bossbar .label{text-align:center;font-weight:800;font-size:14px;
                  text-shadow:0 2px 6px #000;margin-bottom:5px;}
  #bosstrack{height:14px;border-radius:99px;background:rgba(0,0,0,.45);
             border:2px solid rgba(255,255,255,.65);overflow:hidden;}
  #bosshp{height:100%;width:100%;background:linear-gradient(90deg,#ff5f56,#ffb020);
          transition:width .1s linear;}

  /* ---------- overlay ---------- */
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(120% 90% at 50% 20%,rgba(6,20,30,.55),rgba(4,12,18,.9));
           backdrop-filter:blur(3px);padding:24px;}
  #overlay.hidden{display:none;}
  .card{width:min(420px,100%);background:var(--panel);border-radius:22px;padding:26px 22px;
        text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55);
        border:1px solid rgba(255,255,255,.12);}
  .card h1{margin:0 0 6px;font-size:25px;line-height:1.3;letter-spacing:.02em;}
  .card h1 small{display:block;font-size:13px;font-weight:600;opacity:.7;margin-top:6px;letter-spacing:.14em;}
  .card h2{margin:0 0 10px;font-size:24px;}
  .card p{margin:10px 0;font-size:14px;line-height:1.8;opacity:.9;}
  .score{font-size:40px;font-weight:900;color:var(--accent);margin:6px 0 2px;}
  .best{font-size:13px;opacity:.75;}
  .rules{text-align:left;font-size:13px;line-height:1.9;margin:14px auto 4px;max-width:300px;opacity:.92;}
  .rules b{color:var(--accent);}
  button{pointer-events:auto;margin-top:16px;width:100%;padding:15px 20px;font-size:17px;
         font-weight:900;font-family:inherit;color:#0d1b24;border:0;border-radius:14px;
         background:linear-gradient(180deg,#ffd166,#ffb020);cursor:pointer;
         box-shadow:0 6px 0 #c9861a,0 10px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #c9861a,0 6px 14px rgba(0,0,0,.4);}
  button.sub{background:linear-gradient(180deg,#e8eef2,#c3ced6);box-shadow:0 6px 0 #8b979f,0 10px 24px rgba(0,0,0,.35);}
  .tag{display:inline-block;background:rgba(255,255,255,.14);border-radius:99px;
       padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="row">
        <div class="chip">🍎 <span id="count">0</span></div>
        <div class="chip">STAGE <span id="stage-no">1</span>　SCORE <span id="score">0</span></div>
      </div>
      <div id="progress"><div id="bar"></div><div id="goal">🐻</div></div>
      <div id="bossbar">
        <div class="label">くまボス</div>
        <div id="bosstrack"><div id="bosshp"></div></div>
      </div>
      <div id="hint">ドラッグ / ←→ で左右に移動</div>
    </div>

    <div id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
