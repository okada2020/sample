<title>お兄ちゃんと呼ばれるまで</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  /* One deliberate look: a little sister's ruled notebook, red pen and highlighter. */
  :root {
    color-scheme: light;
    --paper: #f6f9fd;
    --rule: #d3dff0;
    --margin: #efa3ad;
    --ink: #262a35;
    --soft: #5f6676;
    --future: #7e8696;
    --red: #d33a2c;
    --hl: #ffe766;
    --blue: #2450c0;
    --skin: #ffe6d6;
    --hair: #3b302b;
    --blush: #f4a0a8;
    --tape: #93d27e;
    --cushion: #f3d27f;
    --hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    --pop: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 22px, var(--margin) 22px, var(--margin) 24px, transparent 24px),
      repeating-linear-gradient(180deg, transparent 0 31px, var(--rule) 31px 32px);
    color: var(--ink);
    font-family: var(--hand);
    font-size: 16px;
    overflow: hidden;
  }
  #app {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 0 38px;
    padding-block: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* rank ladder */
  .ladder { display: flex; justify-content: space-between; align-items: center; gap: 4px;
            font-family: var(--pop); font-size: 14px; list-style: none; padding: 0; margin: 0; }
  .ladder li { color: var(--future); white-space: nowrap; padding: 2px 3px; transition: color .3s; }
  .ladder li.done { color: var(--ink); }
  .ladder li.now { color: var(--ink); background: linear-gradient(transparent 52%, var(--hl) 52%); }
  .ladder .arr { color: var(--future); font-family: var(--hand); padding: 0; }

  /* sister + speech bubble */
  .stage { display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px; }
  #face { width: 108px; height: 108px; display: block; }
  #face .hair { fill: var(--hair); }
  #face .skin { fill: var(--skin); stroke: var(--ink); stroke-width: 2.5; }
  #face .tie { fill: var(--red); }
  #face .ink { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #face .ink .fill { fill: var(--ink); stroke: none; }
  #face .ink .fill-red { fill: var(--red); stroke: var(--ink); }
  #face #blush { fill: var(--blush); transition: opacity .4s; }
  .bubble {
    position: relative; background: #fff; border: 2.5px solid var(--ink);
    border-radius: 18px 22px 16px 24px / 20px 16px 22px 18px;
    padding: 10px 14px; font-size: 18px; font-weight: 600; line-height: 1.5; min-height: 64px;
    display: flex; align-items: center;
  }
  .bubble::before { content: ""; position: absolute; left: -12px; top: 26px; width: 14px; height: 14px;
                    background: #fff; border-left: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
                    transform: rotate(45deg); }
  .bubble.pop { animation: pop .28s ease-out; }
  @keyframes pop { from { transform: scale(.94); } to { transform: none; } }

  /* play area */
  #play { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  h1 { font-family: var(--pop); font-weight: 400; font-size: clamp(30px, 9vw, 40px); line-height: 1.3;
       margin: 0; text-wrap: balance; }
  h1 em { font-style: normal; background: linear-gradient(transparent 55%, var(--hl) 55%); }
  .lead { margin: 0; font-size: 17px; line-height: 1.7; color: var(--ink); }
  .note { margin: 0; font-size: 14px; color: var(--soft); }
  .task { margin: 0; font-size: 18px; font-weight: 600; }
  .task b { font-family: var(--pop); font-weight: 400; font-variant-numeric: tabular-nums; }
  .count { font-size: 14px; color: var(--soft); margin: 0; }

  button, .btn {
    font: inherit; color: inherit; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  .big, .btn {
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    width: 100%; min-height: 58px; padding: 8px 16px;
    font-family: var(--pop); font-size: 20px; color: #fff; background: var(--blue);
    border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink);
    transition: transform .06s, box-shadow .06s;
  }
  .big:active, .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .big:disabled { opacity: .55; cursor: default; }
  .ghost { background: #fff; color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; font-size: 16px; min-height: 50px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .timer { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--red); }
  .meter { height: 26px; border: 2.5px solid var(--ink); border-radius: 8px; background: #fff; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--hl); border-right: 2.5px solid var(--ink); transition: width .08s; }
  .wig { animation: wig .12s; }
  @keyframes wig { 30% { transform: rotate(-3deg); } 70% { transform: rotate(3deg); } }

  .track { position: relative; height: 54px; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; }
  .track .zone { position: absolute; top: 0; bottom: 0; background: var(--tape);
                 border-left: 2px dashed var(--ink); border-right: 2px dashed var(--ink); }
  .track .mark { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px;
                 background: var(--ink); border-radius: 3px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 300px); margin: 0 auto; }
  .cell { aspect-ratio: 1; max-width: 100%; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff;
          display: flex; align-items: center; justify-content: center; padding: 0; }
  .cell svg { width: 62%; height: 62%; }
  .cell.hit { background: #ffd9d4; }
  .cushion .cell { background: var(--cushion); }
  .cushion .cell.open { background: #fff; }
  .cushion .cell.wrong { background: #ffd9d4; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices button { min-height: 56px; font-family: var(--pop); font-size: 22px; font-variant-numeric: tabular-nums;
                    background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
  .q { font-family: var(--pop); font-size: 30px; margin: 0; text-align: center; font-variant-numeric: tabular-nums; }

  .verdict { display: flex; align-items: center; gap: 14px; }
  .verdict svg { width: 76px; height: 76px; flex: none; }
  .verdict p { margin: 0; font-family: var(--pop); font-size: 22px; line-height: 1.4; }
  .verdict .ng { color: var(--red); }

  .result { display: flex; flex-direction: column; gap: 12px; }
  .result .top { display: flex; align-items: center; gap: 12px; }
  .result .top svg { width: 96px; height: 96px; flex: none; }
  .rlabel { margin: 0; font-size: 15px; color: var(--soft); }
  .rname { margin: 0; font-family: var(--pop); font-size: clamp(34px, 11vw, 46px); line-height: 1.2; }
  .rname span { background: linear-gradient(transparent 55%, var(--hl) 55%); }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .draw { stroke-dashoffset: 0; }
  }
  @media (max-height: 640px) {
    #face { width: 84px; height: 84px; }
    .stage { grid-template-columns: 84px 1fr; }
    .bubble { font-size: 16px; min-height: 52px; }
    .big { min-height: 52px; font-size: 18px; }
  }
</style>

<div id="app">
  <ol class="ladder" id="ladder" aria-label="呼び方ランク"></ol>

  <div class="stage">
    <svg id="face" viewBox="0 0 160 160" role="img" aria-label="妹">
      <g class="hair">
        <ellipse cx="138" cy="74" rx="15" ry="32" transform="rotate(18 138 74)"></ellipse>
        <circle cx="80" cy="82" r="60"></circle>
      </g>
      <circle class="skin" cx="80" cy="90" r="50"></circle>
      <path class="hair" d="M29 88 Q28 36 80 33 Q132 36 131 88 Q121 62 100 58 Q96 69 82 69 Q72 61 66 61 Q44 64 29 88Z"></path>
      <circle class="tie" cx="134" cy="46" r="7"></circle>
      <g id="blush"><ellipse cx="53" cy="108" rx="9" ry="5"></ellipse><ellipse cx="107" cy="108" rx="9" ry="5"></ellipse></g>
      <g id="eyes" class="ink"></g>
      <g id="mouth" class="ink"></g>
    </svg>
    <div class="bubble" id="bubble" aria-live="polite">…なに？</div>
  </div>

  <main id="play"></main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const play = $("#play");
  const RANKS = ["ねえ", "アンタ", "兄貴", "兄さん", "お兄ちゃん"];
  const CALL = ["ねえ", "アンタさ", "兄貴", "兄さん", "お兄ちゃん"];
  const THANKS = [null, "…ありがと、アンタ", "へえ、やるじゃん兄貴", "助かった。ありがと、兄さん", "ありがとう、お兄ちゃん！"];
  const ROUNDS = 5, GOAL = 4;

  const TASKS = [
    { key: "jar",    ask: "ジャムのフタ、開かないんだけど", title: "ジャムのフタを開ける", fail: "…もういい。自分でやる", fn: gJar },
    { key: "shelf",  ask: "上の棚のお菓子、取ってくれない？", title: "上の棚のお菓子を取る", fail: "届いてないじゃん", fn: gShelf },
    { key: "math",   ask: "宿題わかんない。ちょっと見て", title: "かけ算の宿題を見る", fail: "…それ違うでしょ", fn: gMath },
    { key: "bug",    ask: "虫いる！むり！なんとかして！", title: "部屋の虫を追い払う", fail: "まだいるって！", fn: gBugs },
    { key: "remote", ask: "リモコンどこ置いたっけ…", title: "リモコンを探す", fail: "そこじゃないよ", fn: gRemote },
  ];

  const S = { rank: 0, round: 0, order: [], sound: false };

  // ---------- storage (optional convenience) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- sound & voice (only after the player picks "音と声あり") ----------
  let ac;
  function sfx(kind) {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      const spec = { tap: [660, "triangle", .06], ok: [880, "triangle", .32], ng: [170, "sawtooth", .3] }[kind];
      o.type = spec[1];
      o.frequency.setValueAtTime(spec[0], t);
      if (kind === "ok") { o.frequency.setValueAtTime(1175, t + .1); o.frequency.setValueAtTime(1568, t + .2); }
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(kind === "ng" ? .08 : .14, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + spec[2]);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + spec[2] + .02);
    } catch (e) {}
  }
  function say(text) {
    if (!S.sound || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/…/g, "、"));
      u.lang = "ja-JP"; u.pitch = 1.45; u.rate = 1.05;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- the sister ----------
  const EYES = {
    flat:  '<path d="M53 94h15M92 94h15"/>',
    dot:   '<ellipse class="fill" cx="61" cy="93" rx="4.5" ry="6"/><ellipse class="fill" cx="99" cy="93" rx="4.5" ry="6"/>',
    happy: '<path d="M52 96q9-11 18 0M90 96q9-11 18 0"/>',
    pout:  '<path d="M54 88l12 5-12 5M106 88l-12 5 12 5"/>',
  };
  const MOUTH = {
    flat:  '<path d="M72 117h16"/>',
    frown: '<path d="M71 120q9-7 18 0"/>',
    smile: '<path d="M68 113q12 12 24 0"/>',
    open:  '<path class="fill-red" d="M69 112q11 16 22 0z"/>',
  };
  const EXPR = { 0: ["flat", "frown"], 1: ["dot", "flat"], 2: ["dot", "flat"], 3: ["dot", "smile"], 4: ["happy", "open"],
                 pout: ["pout", "frown"], glad: ["happy", "smile"] };
  function face(key) {
    const [e, m] = EXPR[key];
    $("#eyes").innerHTML = EYES[e];
    $("#mouth").innerHTML = MOUTH[m];
    $("#blush").style.opacity = key === "pout" ? 0 : [0, 0, .25, .5, .85][S.rank];
  }
  function speak(text, key) {
    const b = $("#bubble");
    b.textContent = text;
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    if (key !== undefined) face(key);
    say(text);
  }
  function ladder() {
    $("#ladder").innerHTML = RANKS.map((r, i) =>
      (i ? '<li class="arr" aria-hidden="true">›</li>' : "") +
      `<li class="${i < S.rank ? "done" : i === S.rank ? "now" : ""}"${i === S.rank ? ' aria-current="step"' : ""}>${r}</li>`
    ).join("");
  }

  // ---------- red-pen marks ----------
  function hanamaru() {
    let d = "M60 60";
    for (let a = 0; a <= Math.PI * 5; a += .2) {
      const r = 4 + a * 1.55;
      d += ` L${(60 + r * Math.cos(a)).toFixed(1)} ${(60 + r * Math.sin(a)).toFixed(1)}`;
    }
    const n = 9, R = 38, C = 52;
    let p = "";
    for (let i = 0; i <= n; i++) {
      const a = -Math.PI / 2 + (i / n) * Math.PI * 2, am = a - Math.PI / n;
      const x = 60 + R * Math.cos(a), y = 60 + R * Math.sin(a);
      p += i === 0 ? `M${x.toFixed(1)} ${y.toFixed(1)}`
                   : ` Q${(60 + C * Math.cos(am)).toFixed(1)} ${(60 + C * Math.sin(am)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return `<svg viewBox="0 0 120 120" aria-label="はなまる"><g fill="none" stroke="#d33a2c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path class="draw" pathLength="1" d="${d}"/><path class="draw" pathLength="1" style="animation-delay:.35s" d="${p}"/></g></svg>`;
  }
  const BATSU = `<svg viewBox="0 0 120 120" aria-label="ばつ"><g fill="none" stroke="#d33a2c" stroke-width="7" stroke-linecap="round">
      <path class="draw" pathLength="1" d="M30 30L90 90"/><path class="draw" pathLength="1" style="animation-delay:.2s" d="M90 30L30 90"/></g></svg>`;
  const BUG = `<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#262a35" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M12 14l-6-4M12 20H5M12 26l-6 4M28 14l6-4M28 20h7M28 26l6 4M17 9l-3-4M23 9l3-4"/></g>
      <ellipse cx="20" cy="21" rx="9" ry="12" fill="#262a35"/><circle cx="20" cy="10" r="5" fill="#262a35"/></svg>`;
  const REMOTE = `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="12" y="4" width="16" height="32" rx="5" fill="#262a35"/>
      <circle cx="20" cy="11" r="3" fill="#d33a2c"/><g fill="#f6f9fd"><rect x="16" y="18" width="3" height="3" rx="1"/><rect x="21" y="18" width="3" height="3" rx="1"/>
      <rect x="16" y="24" width="3" height="3" rx="1"/><rect x="21" y="24" width="3" height="3" rx="1"/></g></svg>`;

  // ---------- helpers ----------
  const rand = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const TIMER = '<div class="timer" aria-hidden="true"><i></i></div>';
  function timer(sec, onEnd) {
    const bar = play.querySelector(".timer i"), t0 = performance.now();
    let raf, stopped = false;
    const tick = now => {
      if (stopped) return;
      const left = 1 - (now - t0) / (sec * 1000);
      if (bar) bar.style.width = Math.max(0, left * 100) + "%";
      if (left <= 0) { stopped = true; onEnd(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { stopped = true; cancelAnimationFrame(raf); };
  }
  function once(fn) { let done = false; return (...a) => { if (!done) { done = true; fn(...a); } }; }

  // ---------- mini games ----------
  function gJar(done) {
    const need = 20;
    play.innerHTML = TIMER + `<p class="task">5秒で20回ひねる <b id="jn">0</b>/20</p>
      <div class="meter" aria-hidden="true"><i id="jf"></i></div>
      <button class="big" id="jb" type="button">フタをひねる</button>`;
    let n = 0;
    const b = $("#jb");
    const fin = once(ok => { stop(); b.disabled = true; done(ok); });
    b.addEventListener("pointerdown", e => {
      e.preventDefault(); n++;
      $("#jn").textContent = Math.min(n, need);
      $("#jf").style.width = Math.min(100, n / need * 100) + "%";
      sfx("tap");
      b.classList.remove("wig"); void b.offsetWidth; b.classList.add("wig");
      if (n >= need) fin(true);
    });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.dispatchEvent(new PointerEvent("pointerdown")); } });
    const stop = timer(5, () => fin(false));
  }

  function gShelf(done) {
    const zw = .17, z0 = .15 + Math.random() * (.7 - zw);
    play.innerHTML = TIMER + `<p class="task">緑のところで「取る」</p>
      <div class="track" aria-hidden="true"><span class="zone" style="left:${z0 * 100}%;width:${zw * 100}%"></span><span class="mark" id="mk"></span></div>
      <button class="big" id="sb" type="button">取る</button>`;
    let pos = 0, dir = 1, last = performance.now(), raf;
    const mk = $("#mk");
    const step = now => {
      const dt = (now - last) / 1000; last = now;
      pos += dir * dt * .95;
      if (pos > 1) { pos = 1; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
      mk.style.left = pos * 100 + "%";
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    const fin = once(ok => { cancelAnimationFrame(raf); stop(); $("#sb").disabled = true; done(ok); });
    $("#sb").addEventListener("click", () => fin(pos >= z0 && pos <= z0 + zw));
    const stop = timer(6, () => fin(false));
  }

  function gMath(done) {
    play.innerHTML = TIMER + `<p class="task">3問とも正解する</p><p class="q" id="mq"></p><div class="choices" id="mc"></div>`;
    let q = 0;
    const fin = once(ok => { stop(); play.querySelectorAll("#mc button").forEach(b => b.disabled = true); done(ok); });
    const next = () => {
      if (q === 3) return fin(true);
      const a = 3 + rand(7), b = 3 + rand(7), ans = a * b;
      const set = new Set([ans]);
      for (const d of shuffle([a, b, -a, -b, 1, -1, 10, -10])) { if (set.size === 4) break; if (ans + d > 0) set.add(ans + d); }
      $("#mq").textContent = `${q + 1}/3　${a} × ${b} = ？`;
      $("#mc").innerHTML = shuffle([...set]).map(v => `<button type="button" data-v="${v}">${v}</button>`).join("");
      $("#mc").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
        if (+btn.dataset.v === ans) { sfx("tap"); q++; next(); } else fin(false);
      }));
    };
    next();
    const stop = timer(15, () => fin(false));
  }

  function gBugs(done) {
    const need = 6;
    play.innerHTML = TIMER + `<p class="task">虫をたたく <b id="bc">0</b>/${need}</p>
      <div class="grid" id="bg">${'<button class="cell" type="button" aria-label="マス"></button>'.repeat(9)}</div>`;
    const cells = [...play.querySelectorAll(".cell")];
    let hits = 0, active = -1;
    const spawn = () => {
      cells.forEach(c => { c.innerHTML = ""; c.setAttribute("aria-label", "マス"); });
      let i; do { i = rand(9); } while (i === active);
      active = i; cells[i].innerHTML = BUG; cells[i].setAttribute("aria-label", "虫");
    };
    spawn();
    const iv = setInterval(spawn, 780);
    cells.forEach((c, i) => c.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (i !== active) return;
      hits++; active = -1; c.innerHTML = ""; c.classList.add("hit"); setTimeout(() => c.classList.remove("hit"), 180);
      sfx("tap"); $("#bc").textContent = hits;
      if (hits >= need) fin(true);
    }));
    const fin = once(ok => { clearInterval(iv); stop(); cells.forEach(c => c.disabled = true); done(ok); });
    const stop = timer(9, () => fin(false));
  }

  function gRemote(done) {
    const target = rand(9);
    play.innerHTML = `<p class="task" id="rt">リモコンの場所を覚えて</p>
      <div class="grid cushion" id="rg">${'<button class="cell" type="button" disabled aria-label="クッション"></button>'.repeat(9)}</div>`;
    const cells = [...play.querySelectorAll(".cell")];
    cells[target].classList.add("open"); cells[target].innerHTML = REMOTE;
    let stop = () => {};
    const fin = once((ok, pick) => {
      stop(); cells.forEach(c => c.disabled = true);
      cells[target].classList.add("open"); cells[target].innerHTML = REMOTE;
      if (!ok && pick !== undefined) cells[pick].classList.add("wrong");
      done(ok);
    });
    setTimeout(() => {
      cells[target].classList.remove("open"); cells[target].innerHTML = "";
      $("#rt").textContent = "どこだった？";
      play.insertAdjacentHTML("afterbegin", TIMER);
      cells.forEach((c, i) => { c.disabled = false; c.addEventListener("click", () => fin(i === target, i)); });
      stop = timer(5, () => fin(false));
    }, 1100);
  }

  // ---------- flow ----------
  function startScreen() {
    S.rank = 0; S.round = 0; ladder(); speak("…なに？", 0);
    const n = store.get("onii.count", 0);
    play.innerHTML = `<h1><em>お兄ちゃん</em>と<br>呼ばれるまで</h1>
      <p class="lead">妹の頼みごとを5つ。<br>4つこなせば、呼び方が「お兄ちゃん」になります。</p>
      <button class="big" id="s1" type="button">音と声ありで始める</button>
      <button class="big ghost" id="s0" type="button">音なしで始める</button>
      <p class="note">${n ? `これまでに「お兄ちゃん」と呼ばれた回数：${n}回` : "声は端末の読み上げ機能を使います"}</p>`;
    $("#s1").addEventListener("click", () => begin(true));
    $("#s0").addEventListener("click", () => begin(false));
  }
  function begin(sound) {
    S.sound = sound; S.rank = 0; S.round = 0; S.order = shuffle(TASKS.slice());
    if (sound && "speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch (e) {} }
    ladder(); intro();
  }
  function intro() {
    const task = S.order[S.round];
    speak(`${CALL[S.rank]}、${task.ask}`, S.rank);
    play.innerHTML = `<p class="count">頼みごと ${S.round + 1} / ${ROUNDS}</p>
      <p class="task">${task.title}</p>
      <button class="big" id="go" type="button">やってあげる</button>`;
    $("#go").addEventListener("click", () => task.fn(ok => setTimeout(() => after(ok, task), 350)));
  }
  function after(ok, task) {
    S.round++;
    if (ok) { S.rank = Math.min(GOAL, S.rank + 1); ladder(); sfx("ok"); speak(THANKS[S.rank], S.rank === GOAL ? 4 : "glad"); }
    else { sfx("ng"); speak(task.fail, "pout"); }
    const left = ROUNDS - S.round;
    const end = S.rank === GOAL || left === 0 || S.rank + left < GOAL;
    play.innerHTML = `<div class="verdict">${ok ? hanamaru() : BATSU}
        <p class="${ok ? "" : "ng"}">${ok ? `呼び方が<br>「${RANKS[S.rank]}」になった` : "呼び方は<br>そのまま"}</p></div>
      <button class="big" id="nx" type="button">${end ? "結果を見る" : "次の頼みごと"}</button>`;
    $("#nx").addEventListener("click", end ? result : intro);
  }
  function result() {
    const win = S.rank === GOAL;
    let n = store.get("onii.count", 0);
    if (win) { n++; store.set("onii.count", n); }
    const name = RANKS[S.rank];
    speak(win ? "お兄ちゃん、また今度も頼んでいい？" : `…${name}、また今度ね`, win ? 4 : S.rank);
    const text = win
      ? "妹の頼みごとをこなして、呼び方が「ねえ」から「お兄ちゃん」になりました。\n#お兄ちゃんと呼ばれるまで"
      : `妹の頼みごと、今日の呼び方は「${name}」止まりでした。\n#お兄ちゃんと呼ばれるまで`;
    play.innerHTML = `<div class="result">
        <div class="top">${win ? hanamaru() : BATSU}<div><p class="rlabel">今日の呼び方</p><p class="rname"><span>${name}</span></p></div></div>
        <p class="note">${win ? `「お兄ちゃん」と呼ばれた回数：${n}回` : `あと${GOAL - S.rank}段で「お兄ちゃん」でした`}</p>
        <div class="row">
          <a class="btn" href="https://x.com/intent/post?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Xで報告</a>
          <button class="btn ghost" id="cp" type="button">文をコピー</button>
        </div>
        <button class="big" id="again" type="button">もう一回</button>
      </div>`;
    $("#cp").addEventListener("click", () => {
      const btn = $("#cp");
      const fallback = () => {
        const ta = document.createElement("textarea"); ta.value = text; ta.readOnly = true;
        ta.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); btn.textContent = "コピーしました"; } catch (e) { btn.textContent = "コピーできませんでした"; }
        ta.remove();
      };
      try { navigator.clipboard.writeText(text).then(() => { btn.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
    });
    $("#again").addEventListener("click", () => begin(S.sound));
  }

  face(0);
  startScreen();
})();
</script>
