<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f3f2ee; --panel:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#d9d8d2;
    --accent:#2f6fdb; --accent-ink:#ffffff; --view:#15171b; --chip:#eceae3; --warn:#b8651a;
    --font-ui:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111317; --panel:#1a1d23; --ink:#e8e6df; --muted:#9a9ea8; --line:#2b2f37;
      --accent:#6b9cf0; --accent-ink:#0b1220; --view:#0c0d10; --chip:#242830; --warn:#e0904a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111317; --panel:#1a1d23; --ink:#e8e6df; --muted:#9a9ea8; --line:#2b2f37;
    --accent:#6b9cf0; --accent-ink:#0b1220; --view:#0c0d10; --chip:#242830; --warn:#e0904a;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
  .wrap{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding-block:12px;padding-inline:16px;height:100%;box-sizing:border-box}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
  header .sub{color:var(--muted);font-size:12px}
  header .sub b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;min-height:0}
  aside h2{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .cut{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;width:100%;text-align:left;color:inherit;font:inherit}
  .cut:hover{background:var(--chip)}
  .cut[aria-current="true"]{border-left-color:var(--accent);background:var(--chip)}
  .cut .id{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:34px}
  .cut .name{font-weight:500}
  .cut .cam{font-family:var(--font-mono);font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .cut .dur{grid-column:2;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-height:0;min-width:0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar .spacer{flex:1}
  button.b{font:inherit;font-size:13px;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  button.b:hover{border-color:var(--accent)}
  button.b[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stage{position:relative;background:var(--view);border-radius:6px;display:grid;place-items:center;min-height:0;overflow:hidden}
  .stage canvas{display:block;max-width:100%;max-height:100%}
  .hud{position:absolute;left:12px;top:10px;font-family:var(--font-mono);font-size:12px;color:#e8e6df;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:4px;pointer-events:none}
  .hud b{color:#ffd166;font-weight:500}
  .hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:rgba(232,230,223,.7);pointer-events:none}
  .notes{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
  .notes p{margin:0}
  .notes .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .notes .caminfo{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .editor{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:6px}
  .editor summary{padding:8px 12px;cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .editor .body{padding:0 12px 12px;display:grid;gap:8px}
  textarea{width:100%;box-sizing:border-box;min-height:220px;font-family:var(--font-mono);font-size:12px;line-height:1.45;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px}
  .err{color:var(--warn);font-family:var(--font-mono);font-size:12px;min-height:1.2em}
  @media (max-width:760px){
    .wrap{grid-template-columns:1fr;grid-template-rows:auto auto minmax(360px,60vh) auto;height:auto}
    aside{max-height:200px}
    .notes{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap">
  <header>
    <h1 id="title">プリビズ</h1>
    <span class="sub">尺 <b id="total">0s</b> · <b id="ncuts">0</b> カット · 単位 m · 向き 0°=+z 90°=+x</span>
  </header>

  <aside>
    <h2>カット</h2>
    <div id="cutlist" role="list"></div>
  </aside>

  <main>
    <div class="bar">
      <button class="b" id="prev" type="button">← 前</button>
      <button class="b" id="next" type="button">次 →</button>
      <span class="spacer"></span>
      <button class="b" id="modeCut" type="button" aria-pressed="true">カットのカメラ</button>
      <button class="b" id="modeOrbit" type="button" aria-pressed="false">俯瞰で回す</button>
      <button class="b" id="modeTop" type="button" aria-pressed="false">真上</button>
      <button class="b" id="thirds" type="button" aria-pressed="false">三分割</button>
      <button class="b" id="labels" type="button" aria-pressed="true">ラベル</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="hud" id="hud"></div>
      <div class="hint">← → でカット切替 · ドラッグで回転 · ホイールでズーム</div>
    </div>
    <div class="notes">
      <div><p class="k">演出メモ</p><p id="notes">—</p></div>
      <div class="caminfo" id="caminfo"></div>
    </div>
  </main>

  <details class="editor">
    <summary>シーン JSON（編集して「適用」）</summary>
    <div class="body">
      <textarea id="json" spellcheck="false"></textarea>
      <div class="bar">
        <button class="b" id="apply" type="button">適用</button>
        <button class="b" id="copy" type="button">JSONをコピー</button>
        <span class="err" id="err"></span>
      </div>
    </div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const SCENE_INITIAL = __SCENE_JSON__;

  const $ = id => document.getElementById(id);
  const deg = d => d * Math.PI / 180;
  const stage = $('stage'), canvas = $('view');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

  let scene, camera, S, cutIndex = 0, mode = 'cut', showThirds = false, showLabels = true;
  let actorObjs = {}, propObjs = {}, labelSprites = [], thirdsObj = null, cardObj = null;
  const orbit = {theta: 0.6, phi: 1.05, r: 14, target: new THREE.Vector3(0,1,0)};

  // ---------- geometry helpers ----------
  function textSprite(text, color, bg){
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    ctx.font = '500 40px "Zen Kaku Gothic New", system-ui, sans-serif';
    const w = Math.ceil(ctx.measureText(text).width) + 36; c.width = w; c.height = 64;
    ctx.font = '500 40px "Zen Kaku Gothic New", system-ui, sans-serif';
    ctx.fillStyle = bg || 'rgba(0,0,0,0.65)'; ctx.fillRect(0,0,w,64);
    ctx.fillStyle = color || '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(text, 18, 32);
    const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
    sp.scale.set(w/160, 0.4, 1); sp.renderOrder = 10; labelSprites.push(sp); return sp;
  }
  function edged(mesh, color){
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({color: color||0x000000, transparent:true, opacity:0.35}));
    mesh.add(e); return mesh;
  }
  function makeActor(a){
    const g = new THREE.Group();
    const h = a.height || 1.7, rh = 0.13, hb = h - rh*2;
    const col = new THREE.Color(a.color || '#2f6fdb');
    const mat = new THREE.MeshLambertMaterial({color: col});
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,hb,12), mat); body.position.y = hb/2; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(rh,20,16), mat); head.position.y = hb + rh; g.add(head);
    // nose cone: points along local +z, i.e. the facing direction
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.05,0.16,12), new THREE.MeshLambertMaterial({color:0xffd166}));
    nose.rotation.x = Math.PI/2; nose.position.set(0, hb + rh, rh + 0.06); g.add(nose);
    // ground arrow: flat triangle pointing +z
    const sh = new THREE.Shape(); sh.moveTo(-0.16,0); sh.lineTo(0.16,0); sh.lineTo(0,0.55); sh.closePath();
    const arrow = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({color: col, transparent:true, opacity:0.85, side:THREE.DoubleSide}));
    arrow.rotation.x = -Math.PI/2; arrow.position.y = 0.012; g.add(arrow);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.2,0.24,32), new THREE.MeshBasicMaterial({color: col, side:THREE.DoubleSide, transparent:true, opacity:0.6}));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.011; g.add(ring);
    const lab = textSprite(a.label || a.id, '#fff'); lab.position.y = h + 0.35; g.add(lab);
    g.userData = {def:a, height:h, label:lab};
    return g;
  }
  function makeProp(p){
    let m;
    const col = new THREE.Color(p.color || '#9a9a9a');
    if (p.type === 'plane'){
      m = new THREE.Mesh(new THREE.PlaneGeometry(p.size[0], p.size[1]), new THREE.MeshLambertMaterial({color: col}));
      m.rotation.x = -Math.PI/2; m.position.set(p.pos[0], p.pos[1]||0, p.pos[2]);
      const grid = new THREE.GridHelper(Math.max(p.size[0],p.size[1]), Math.max(p.size[0],p.size[1]), 0x888888, 0xbbbbbb);
      grid.material.transparent = true; grid.material.opacity = 0.25; grid.position.set(p.pos[0], (p.pos[1]||0)+0.002, p.pos[2]);
      const g = new THREE.Group(); g.add(m); g.add(grid); return g;
    }
    if (p.type === 'cylinder'){
      m = edged(new THREE.Mesh(new THREE.CylinderGeometry(p.radius, p.radius, p.height, 24), new THREE.MeshLambertMaterial({color: col})));
      m.position.set(p.pos[0], (p.pos[1]||0) + p.height/2, p.pos[2]);
    } else if (p.type === 'label'){
      const sp = textSprite(p.text || p.label || p.id, p.color || '#fff', p.bg); sp.scale.multiplyScalar(p.scale || 1.6);
      sp.position.set(p.pos[0], p.pos[1], p.pos[2]); return sp;
    } else { // box
      m = edged(new THREE.Mesh(new THREE.BoxGeometry(p.size[0], p.size[1], p.size[2]), new THREE.MeshLambertMaterial({color: col, transparent: !!p.opacity, opacity: p.opacity || 1})));
      m.position.set(p.pos[0], (p.pos[1]||0) + p.size[1]/2, p.pos[2]);
    }
    m.rotation.y = deg(p.rot || 0);
    if (p.label){ const lab = textSprite(p.label, '#fff', 'rgba(40,40,40,0.7)'); lab.position.y = (p.size ? p.size[1]/2 : p.height/2) + 0.25; m.add(lab); }
    return m;
  }

  // ---------- scene build ----------
  function build(def){
    S = def; actorObjs = {}; propObjs = {}; labelSprites = [];
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x15171b);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4a, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(4,10,3); scene.add(sun);
    (def.props||[]).forEach(p => { const o = makeProp(p); o.userData.def = p; propObjs[p.id] = o; scene.add(o); });
    (def.actors||[]).forEach(a => { const o = makeActor(a); actorObjs[a.id] = o; scene.add(o); });
    // rule-of-thirds overlay lives in screen space: drawn as an ortho HUD scene
    thirdsObj = new THREE.Scene();
    const lm = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.35});
    [[-1/3,-1,-1/3,1],[1/3,-1,1/3,1],[-1,-1/3,1,-1/3],[-1,1/3,1,1/3]].forEach(([x1,y1,x2,y2])=>{
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,0), new THREE.Vector3(x2,y2,0)]);
      thirdsObj.add(new THREE.Line(g, lm));
    });
    cardObj = null;
    const aspect = parseAspect(def.aspect || '9:16');
    camera = new THREE.PerspectiveCamera(60, aspect, 0.05, 200);
    $('title').textContent = def.title || 'プリビズ'; document.title = def.title || 'プリビズ';
    $('ncuts').textContent = (def.cuts||[]).length;
    $('total').textContent = (def.cuts||[]).reduce((s,c)=>s+(c.dur||0),0) + 's';
    renderList(); cutIndex = Math.min(cutIndex, Math.max(0,(def.cuts||[]).length-1)); resize(); applyCut();
  }
  function parseAspect(s){ const [w,h] = String(s).split(':').map(Number); return (w&&h) ? w/h : 9/16; }

  function renderList(){
    const list = $('cutlist'); list.innerHTML = '';
    (S.cuts||[]).forEach((c,i)=>{
      const b = document.createElement('button'); b.className='cut'; b.type='button'; b.setAttribute('role','listitem');
      b.innerHTML = `<span class="id">${c.id||('#'+(i+1))}</span><span class="name"></span><span class="cam">${(c.camera&&c.camera.type)||'pov'}</span><span class="dur">${c.dur||0}s</span>`;
      b.querySelector('.name').textContent = c.name || '';
      b.addEventListener('click', ()=>{ cutIndex = i; mode='cut'; syncModeButtons(); applyCut(); });
      list.appendChild(b);
    });
  }

  // apply per-cut overrides and camera
  function applyCut(){
    const cut = (S.cuts||[])[cutIndex]; if(!cut) return;
    // reset actors to base, then override
    (S.actors||[]).forEach(a=>{
      const o = actorObjs[a.id]; const ov = (cut.actors||{})[a.id] || {};
      const pos = ov.pos || a.pos || [0,0,0]; const heading = (ov.heading!=null? ov.heading : (a.heading||0));
      o.position.set(pos[0], pos[1]||0, pos[2]); o.rotation.y = deg(heading);
      const vis = ov.visible!=null ? ov.visible : (a.visible!=null ? a.visible : true);
      o.visible = vis; o.userData.heading = heading;
    });
    (S.props||[]).forEach(p=>{ const ov=(cut.props||{})[p.id]||{}; const o=propObjs[p.id]; o.visible = ov.visible!=null?ov.visible:(p.visible!=null?p.visible:true); });
    labelSprites.forEach(s=> s.visible = showLabels && s.visible !== false);
    document.querySelectorAll('.cut').forEach((el,i)=> el.setAttribute('aria-current', i===cutIndex ? 'true':'false'));
    $('notes').textContent = cut.notes || '—';
    placeCamera(cut); render();
  }

  function placeCamera(cut){
    const cam = cut.camera || {type:'pov'};
    let info = '';
    if (mode === 'orbit' || mode === 'top'){
      const p = mode==='top' ? new THREE.Vector3(orbit.target.x, orbit.r, orbit.target.z + 0.001)
        : new THREE.Vector3(orbit.target.x + orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta), orbit.target.y + orbit.r*Math.cos(orbit.phi), orbit.target.z + orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta));
      camera.position.copy(p); camera.fov = 50; camera.up.set(0,1,0); camera.lookAt(orbit.target); camera.updateProjectionMatrix();
      Object.values(actorObjs).forEach(o=> o.traverse(m=>{ if(m.isMesh) m.visible = true; }));
      info = `俯瞰 · r=${orbit.r.toFixed(1)}m`;
    } else if (cam.type === 'free'){
      camera.position.set(...cam.pos); camera.fov = cam.fov || 60; camera.up.set(0,1,0); camera.lookAt(new THREE.Vector3(...(cam.lookAt||[0,1,0]))); camera.updateProjectionMatrix();
      Object.values(actorObjs).forEach(o=> o.traverse(m=>{ if(m.isMesh) m.visible = true; }));
      info = `固定カメラ ${cam.id||''} · pos ${fmt(cam.pos)} · fov ${camera.fov}°`;
    } else if (cam.type === 'card'){
      info = 'タイトルカード';
    } else { // pov
      const actor = actorObjs[cam.actor || 'hero']; if(!actor) return;
      const h = actor.userData.height, eye = cam.eyeHeight != null ? cam.eyeHeight : h - 0.1;
      const yaw = deg(actor.userData.heading + (cam.yaw||0)), pitch = deg(cam.pitch||0);
      const dir = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
      const fwd = new THREE.Vector3(Math.sin(deg(actor.userData.heading)),0,Math.cos(deg(actor.userData.heading)));
      camera.position.copy(actor.position).add(new THREE.Vector3(0,eye,0)).add(fwd.multiplyScalar(0.08));
      camera.fov = cam.fov || 70; camera.up.set(0,1,0); camera.lookAt(camera.position.clone().add(dir)); camera.updateProjectionMatrix();
      // hide the POV actor's own body so the head sphere does not block the lens
      actor.traverse(m=>{ if(m.isMesh) m.visible = false; });
      Object.values(actorObjs).forEach(o=>{ if(o!==actor) o.traverse(m=>{ if(m.isMesh) m.visible = true; }); });
      info = `POV ${cam.actor||'hero'} · yaw ${cam.yaw||0}° · pitch ${cam.pitch||0}° · fov ${camera.fov}° · eye ${eye.toFixed(2)}m`;
    }
    $('caminfo').textContent = info;
    $('hud').innerHTML = `<b>${cut.id||''}</b> ${esc(cut.name||'')} · ${cut.dur||0}s`;
  }
  const fmt = v => '['+v.map(n=>(+n).toFixed(1)).join(', ')+']';
  const esc = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // ---------- render ----------
  const hudCam = new THREE.OrthographicCamera(-1,1,1,-1,0,10); hudCam.position.z = 1;
  function render(){
    const cut = (S.cuts||[])[cutIndex]; const cam = cut && cut.camera;
    renderer.autoClear = true;
    if (cam && cam.type === 'card' && mode==='cut'){ drawCard(cut); return; }
    renderer.render(scene, camera);
    if (showThirds){ renderer.autoClear = false; renderer.render(thirdsObj, hudCam); renderer.autoClear = true; }
  }
  function drawCard(cut){
    // a title card is flat text on black: draw it with a 2D canvas texture on a full-frame quad
    const c = document.createElement('canvas'); c.width = 540; c.height = Math.round(540 / camera.aspect);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    const lines = cut.camera.lines || [cut.name||''];
    lines.forEach((t,i)=>{ ctx.font = (i===0? '700 44px' : '400 20px') + ' "Zen Kaku Gothic New", system-ui, sans-serif'; ctx.fillText(t, c.width/2, c.height/2 + (i===0? 0 : 60 + (i-1)*30)); });
    const tex = new THREE.CanvasTexture(c); const sc = new THREE.Scene();
    sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.MeshBasicMaterial({map:tex})));
    renderer.render(sc, hudCam);
  }
  function resize(){
    const aspect = camera ? camera.aspect : 9/16;
    const W = stage.clientWidth, H = stage.clientHeight;
    let w = W, h = Math.round(W/aspect); if (h > H){ h = H; w = Math.round(H*aspect); }
    renderer.setSize(w, h, false); canvas.style.width = w+'px'; canvas.style.height = h+'px';
    if (camera){ camera.aspect = aspect; camera.updateProjectionMatrix(); }
    render();
  }

  // ---------- interaction ----------
  let drag = null;
  canvas.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY}; if(mode==='cut'){ mode='orbit'; syncModeButtons(); seedOrbitFromCamera(); } canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY};
    if (mode==='top'){ orbit.target.x -= dx*0.02*orbit.r/10; orbit.target.z -= dy*0.02*orbit.r/10; }
    else { orbit.theta -= dx*0.008; orbit.phi = Math.min(Math.PI-0.05, Math.max(0.05, orbit.phi - dy*0.008)); }
    placeCamera(S.cuts[cutIndex]); render(); });
  canvas.addEventListener('pointerup', ()=> drag=null);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); if(mode==='cut'){ mode='orbit'; syncModeButtons(); seedOrbitFromCamera(); } orbit.r = Math.min(60, Math.max(1.5, orbit.r * (1 + Math.sign(e.deltaY)*0.1))); placeCamera(S.cuts[cutIndex]); render(); }, {passive:false});
  function seedOrbitFromCamera(){
    // start the orbit from wherever the cut camera was looking, so switching modes feels continuous
    const cut = S.cuts[cutIndex]; const cam = cut.camera||{};
    if (cam.type === 'pov'){ const a = actorObjs[cam.actor||'hero']; if(a) orbit.target.copy(a.position).setY(1); }
    else if (cam.lookAt) orbit.target.set(...cam.lookAt);
  }
  function syncModeButtons(){ $('modeCut').setAttribute('aria-pressed', mode==='cut'); $('modeOrbit').setAttribute('aria-pressed', mode==='orbit'); $('modeTop').setAttribute('aria-pressed', mode==='top'); }
  $('modeCut').onclick = ()=>{ mode='cut'; syncModeButtons(); applyCut(); };
  $('modeOrbit').onclick = ()=>{ mode='orbit'; syncModeButtons(); seedOrbitFromCamera(); applyCut(); };
  $('modeTop').onclick = ()=>{ mode='top'; syncModeButtons(); seedOrbitFromCamera(); orbit.r = Math.max(orbit.r, 12); applyCut(); };
  $('thirds').onclick = ()=>{ showThirds=!showThirds; $('thirds').setAttribute('aria-pressed', showThirds); render(); };
  $('labels').onclick = ()=>{ showLabels=!showLabels; $('labels').setAttribute('aria-pressed', showLabels); applyCut(); };
  $('prev').onclick = ()=> step(-1); $('next').onclick = ()=> step(1);
  function step(d){ const n=(S.cuts||[]).length; if(!n) return; cutIndex=(cutIndex+d+n)%n; mode='cut'; syncModeButtons(); applyCut(); }
  window.addEventListener('keydown', e=>{ if(e.target.tagName==='TEXTAREA') return; if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
  window.addEventListener('resize', resize);

  // ---------- JSON editor ----------
  $('json').value = JSON.stringify(SCENE_INITIAL, null, 2);
  $('apply').onclick = ()=>{ try{ const d = JSON.parse($('json').value); $('err').textContent=''; build(d); }catch(err){ $('err').textContent = 'JSONエラー: ' + err.message; } };
  $('copy').onclick = async ()=>{ try{ await navigator.clipboard.writeText($('json').value); $('err').textContent='コピーしました'; setTimeout(()=>$('err').textContent='',1500);}catch(e){ $('err').textContent='コピーできませんでした（手動で選択してください）'; } };

  build(SCENE_INITIAL);
  // fonts load after first paint; re-render labels once they arrive
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=> build(S));
})();
</script>
