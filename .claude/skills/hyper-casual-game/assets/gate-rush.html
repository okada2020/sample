<title>ゲートラッシュ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap">
<style>
  :root{ --bg:#1b7fd6; --ink:#ffffff; --panel:rgba(10,30,60,.72); --good:#2f6fdb; --bad:#d9342b; --gold:#ffd23f;
         --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif; }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#0f4f8a}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;justify-items:center;gap:6px;pointer-events:none}
  .count{font-size:clamp(34px,9vw,56px);font-weight:900;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
  .count small{font-size:.4em;font-weight:700;opacity:.9;margin-left:.2em}
  .prog{width:min(60vw,320px);height:8px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .15s linear}
  .overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,20,40,.55);backdrop-filter:blur(3px)}
  .card{background:var(--panel);border-radius:18px;padding:26px 30px;text-align:center;max-width:min(88vw,360px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .card h1{margin:0 0 6px;font-size:30px;font-weight:900;letter-spacing:.02em}
  .card p{margin:0 0 18px;font-size:15px;line-height:1.6;opacity:.92}
  .btn{font:inherit;font-weight:900;font-size:18px;color:#0b1d3a;background:var(--gold);border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 5px 0 #c9a12b}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a12b}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-weight:700;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.4);pointer-events:none;opacity:.9}
  @media (prefers-reduced-motion: reduce){ .prog i{transition:none} }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<div class="hud"><div class="count"><span id="n">10</span><small>人</small></div><div class="prog"><i id="prog"></i></div></div>
<div class="tip" id="tip">左右にドラッグして青いゲートへ</div>
<div class="overlay" id="ov">
  <div class="card">
    <h1 id="ovTitle">ゲートラッシュ</h1>
    <p id="ovText">兵士を連れて橋を渡れ。<br>「+」「×」のゲートで仲間を増やし、赤い軍勢とボスを数で押し切る。</p>
    <button class="btn" id="ovBtn" type="button">スタート</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('c'), stage = $('stage');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b7fd6); scene.fog = new THREE.Fog(0x1b7fd6, 40, 90);
  const camera = new THREE.PerspectiveCamera(58, 9/16, 0.1, 200);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6a90, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(6, 14, -4); scene.add(sun);

  // ---------- world ----------
  const HALF = 3, LEN = 230, MAXU = 400;
  const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 600), new THREE.MeshLambertMaterial({color:0x1e6fd0}));
  water.rotation.x = -Math.PI/2; water.position.set(0,-0.6,LEN/2); scene.add(water);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(HALF*2+1.2, 0.6, LEN+30), new THREE.MeshLambertMaterial({color:0xd8cdb4}));
  deck.position.set(0,-0.3,LEN/2); scene.add(deck);
  const wallMat = new THREE.MeshLambertMaterial({color:0xbfb49b});
  [-1,1].forEach(s=>{ const w = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,LEN+30), wallMat); w.position.set(s*(HALF+0.35),0.35,LEN/2); scene.add(w);
    for(let z=0; z<LEN+30; z+=2.2){ const b = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,1.2), wallMat); b.position.set(s*(HALF+0.35),0.85,z); scene.add(b); } });
  // pavement lines for a sense of speed
  const lineMat = new THREE.MeshLambertMaterial({color:0xc9bda3});
  for(let z=0; z<LEN+30; z+=3){ const l = new THREE.Mesh(new THREE.BoxGeometry(HALF*2, 0.02, 0.08), lineMat); l.position.set(0,0.01,z); scene.add(l); }

  // ---------- units (instanced: body + head) ----------
  function unitMeshes(color){
    const mat = new THREE.MeshLambertMaterial({color});
    const body = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.11,0.13,0.42,8), mat, MAXU);
    const head = new THREE.InstancedMesh(new THREE.SphereGeometry(0.15,10,8), new THREE.MeshLambertMaterial({color:0xf5d6b8}), MAXU);
    const hat  = new THREE.InstancedMesh(new THREE.ConeGeometry(0.16,0.2,8), mat, MAXU);
    [body,head,hat].forEach(m=>{ m.count=0; scene.add(m); });
    return {body,head,hat};
  }
  const dummy = new THREE.Object3D();
  function layoutUnits(meshes, n, cx, cz, t, spread){
    n = Math.min(n, MAXU);
    for(let i=0;i<n;i++){
      const r = spread*Math.sqrt(i), a = i*2.39996; // sunflower packing keeps the blob round at any size
      const x = Math.max(-HALF+0.2, Math.min(HALF-0.2, cx + r*Math.cos(a))), z = cz - r*Math.sin(a) - r*0.6;
      const bob = Math.abs(Math.sin(t*10 + i))*0.06;
      dummy.position.set(x, 0.21+bob, z); dummy.rotation.set(0,0,0); dummy.updateMatrix(); meshes.body.setMatrixAt(i, dummy.matrix);
      dummy.position.set(x, 0.55+bob, z); dummy.updateMatrix(); meshes.head.setMatrixAt(i, dummy.matrix);
      dummy.position.set(x, 0.78+bob, z); dummy.updateMatrix(); meshes.hat.setMatrixAt(i, dummy.matrix);
    }
    [meshes.body, meshes.head, meshes.hat].forEach(m=>{ m.count = n; m.instanceMatrix.needsUpdate = true; });
  }
  const blue = unitMeshes(0x2f6fdb);

  // ---------- gates ----------
  function textSprite(text, color){
    const c = document.createElement('canvas'); c.width = 256; c.height = 128; const ctx = c.getContext('2d');
    ctx.font = '900 96px "M PLUS Rounded 1c", system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(text,128,68); ctx.fillStyle = color; ctx.fillText(text,128,68);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthTest:false})); sp.scale.set(2.2,1.1,1); return sp;
  }
  const gates = [], enemies = [], arrows = [];
  const OPS = [['+',3],['+',5],['+',8],['+',12],['x',2],['x',3],['-',6],['-',10],['/',2]];
  function makeGate(z, side, op, v){
    const good = op==='+'||op==='x';
    const g = new THREE.Group();
    const panel = new THREE.Mesh(new THREE.BoxGeometry(HALF-0.1, 1.9, 0.12), new THREE.MeshLambertMaterial({color: good?0x2f6fdb:0xd9342b, transparent:true, opacity:0.85}));
    panel.position.y = 1.15; g.add(panel);
    const label = textSprite((op==='x'?'×':op==='/'?'÷':op)+v, '#fff'); label.position.set(0,1.25,0.2); g.add(label);
    g.position.set(side*(HALF/2), 0, z); scene.add(g);
    gates.push({z, side, op, v, used:false, obj:g, panel});
  }
  function makeEnemy(z, count, boss){
    const meshes = unitMeshes(0xd9342b); const e = {z, x:0, count, max:count, boss, meshes, dead:false, obj:null, label:null};
    if (boss){ // one big brute instead of a crowd
      const g = new THREE.Group(); const m = new THREE.MeshLambertMaterial({color:0xd9342b});
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,1.6,12), m); body.position.y=0.8; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.5,14,12), new THREE.MeshLambertMaterial({color:0xf5d6b8})); head.position.y=1.9; g.add(head);
      const eyes = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.12,0.1), new THREE.MeshBasicMaterial({color:0xff2a2a})); eyes.position.set(0,1.95,-0.45); g.add(eyes);
      const club = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.18,1.3,8), new THREE.MeshLambertMaterial({color:0x9a6b3a})); club.position.set(0.85,1.0,0); club.rotation.z=0.5; g.add(club);
      e.label = textSprite(String(count), '#fff'); e.label.position.y = 3.0; g.add(e.label);
      g.position.set(0,0,z); scene.add(g); e.obj = g;
    }
    enemies.push(e);
  }
  const wallMatB = new THREE.MeshLambertMaterial({color:0x8a7f70});
  const gateEnd = new THREE.Mesh(new THREE.BoxGeometry(HALF*2+1.2, 3, 1), wallMatB); gateEnd.position.set(0,1.5,LEN+8); scene.add(gateEnd);

  // ---------- game state ----------
  const S = { on:false, over:false, t:0, z:0, x:0, targetX:0, n:10, speed:7 };
  const arrowGeo = new THREE.CylinderGeometry(0.02,0.02,0.7,4), arrowMat = new THREE.MeshBasicMaterial({color:0xfff2a8});
  function reset(){
    gates.forEach(g=>scene.remove(g.obj)); gates.length=0;
    enemies.forEach(e=>{ [e.meshes.body,e.meshes.head,e.meshes.hat].forEach(m=>scene.remove(m)); if(e.obj) scene.remove(e.obj); }); enemies.length=0;
    arrows.forEach(a=>scene.remove(a.m)); arrows.length=0;
    Object.assign(S,{on:true, over:false, t:0, z:0, x:0, targetX:0, n:10});
    // gates every 16 m; each pair always offers one good option so a careful run can only grow
    for(let z=16; z<150; z+=16){
      const gi = 4+Math.floor(Math.random()*2), bi = Math.floor(Math.random()*OPS.length);
      const good = OPS[Math.random()<0.6 ? Math.floor(Math.random()*4) : gi], other = OPS[bi];
      const side = Math.random()<0.5?-1:1;
      makeGate(z, side, good[0], good[1]); makeGate(z, -side, other[0], other[1]);
    }
    makeEnemy(62, 18); makeEnemy(104, 45); makeEnemy(150, 110); makeEnemy(LEN-6, 380, true);
    updateHud(); $('ov').hidden = true; $('tip').hidden = false; setTimeout(()=>{ $('tip').hidden = true; }, 3500);
  }
  function updateHud(){ $('n').textContent = Math.max(0, Math.round(S.n)); $('prog').style.width = Math.min(100, S.z/LEN*100)+'%'; }
  function end(win){
    S.over = true; S.on = false;
    $('ovTitle').textContent = win ? 'ステージクリア！' : '全滅…';
    $('ovText').textContent = win ? `${Math.round(S.n)}人で橋を渡り切った。` : '赤い軍勢に押し切られた。青いゲートを選んで仲間を増やそう。';
    $('ovBtn').textContent = win ? 'もう一度' : 'リトライ'; $('ov').hidden = false;
  }

  // ---------- input ----------
  let drag = null;
  canvas.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, tx:S.targetX}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!drag) return; S.targetX = Math.max(-HALF+0.6, Math.min(HALF-0.6, drag.tx + (e.clientX-drag.x)/canvas.clientWidth*HALF*2.2)); });
  canvas.addEventListener('pointerup', ()=> drag=null);
  const keys = {}; addEventListener('keydown', e=>{ keys[e.key]=true; }); addEventListener('keyup', e=>{ keys[e.key]=false; });
  $('ovBtn').onclick = reset;

  // ---------- loop ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now; S.t += dt;
    if (S.on){
      if (keys.ArrowLeft) S.targetX = Math.max(-HALF+0.6, S.targetX - 6*dt);
      if (keys.ArrowRight) S.targetX = Math.min(HALF-0.6, S.targetX + 6*dt);
      S.x += (S.targetX - S.x) * Math.min(1, dt*9);
      // the crowd stops to fight when an enemy blocks the way; otherwise it runs
      const blocker = enemies.find(e=>!e.dead && e.z - S.z < (e.boss?3.2:1.6) && e.z > S.z - 2);
      if (!blocker) S.z += S.speed*dt;
      // gates
      gates.forEach(g=>{ if(!g.used && S.z >= g.z && S.z - S.speed*dt < g.z + 0.5){
        if ((S.x<0?-1:1) === g.side){ g.used = true; g.panel.material.opacity = 0.25;
          if (g.op==='+') S.n += g.v; else if (g.op==='x') S.n *= g.v; else if (g.op==='-') S.n -= g.v; else S.n = Math.floor(S.n/g.v);
          S.n = Math.max(0, Math.min(MAXU, S.n)); }
        else g.used = true; // the other side is gone once you pass it
      }});
      // enemies: advance when close, take arrow damage in range, trade blows in melee
      enemies.forEach(e=>{
        if (e.dead) return;
        const d = e.z - S.z;
        if (d < 22 && d > 1.5) e.z -= (e.boss?1.6:2.4)*dt;
        if (d < 20 && d > 0){
          e.count -= S.n * (e.boss?0.9:1.3) * dt;
          if (Math.random() < Math.min(1, S.n*dt*0.35)){ const m = new THREE.Mesh(arrowGeo, arrowMat); m.rotation.x = Math.PI/2 - 0.5;
            m.position.set(S.x + (Math.random()-0.5)*2, 0.9, S.z + (Math.random()-0.5)*2); arrows.push({m, vz: 26, vy: 7, life: 0.9}); scene.add(m); }
        }
        if (d < (e.boss?3.2:1.6)) S.n -= (e.boss ? 14 : Math.min(e.count, 30)*0.55) * dt;
        if (e.count <= 0){ e.dead = true; [e.meshes.body,e.meshes.head,e.meshes.hat].forEach(m=>m.count=0); if(e.obj) scene.remove(e.obj); if (e.boss) end(true); }
        else if (e.boss){ e.obj.position.z = e.z; e.obj.position.y = Math.abs(Math.sin(S.t*6))*0.15; e.label.material.map.dispose();
          const nl = textSprite(String(Math.ceil(e.count)), '#fff'); e.label.material.map = nl.material.map; }
        else layoutUnits(e.meshes, Math.ceil(e.count), e.x, e.z, S.t, 0.3);
      });
      arrows.forEach(a=>{ a.m.position.z += a.vz*dt; a.m.position.y += a.vy*dt; a.vy -= 24*dt; a.life -= dt; });
      for(let i=arrows.length-1;i>=0;i--) if(arrows[i].life<=0){ scene.remove(arrows[i].m); arrows.splice(i,1); }
      if (S.n <= 0){ S.n = 0; end(false); }
      if (S.z > LEN+2 && !S.over) end(true);
      updateHud();
    }
    layoutUnits(blue, Math.max(1, Math.round(S.n)), S.x, S.z, S.t, 0.27);
    camera.position.set(S.x*0.35, 8.5, S.z - 9.5); camera.lookAt(S.x*0.2, 0.6, S.z + 7);
    renderer.render(scene, camera); requestAnimationFrame(frame);
  }
  function resize(){
    const W = stage.clientWidth, H = stage.clientHeight; let w = W, h = H; // fill the viewport, but never wider than 9:16 on desktop
    if (W/H > 9/16){ w = Math.round(H*9/16); } renderer.setSize(w, h, false); canvas.style.width=w+'px'; canvas.style.height=h+'px';
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  layoutUnits(blue, 10, 0, 0, 0, 0.27); // something to look at behind the start card
  requestAnimationFrame(frame);
})();
</script>
