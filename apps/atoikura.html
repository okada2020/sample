<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あといくら</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #F4F6F4;
    --surface: #FFFFFF;
    --ink: #1A2420;
    --ink-mid: #5E6E66;
    --line: #DDE4DF;
    --brand: #1F6B4A;
    --brand-soft: #E2EFE8;
    --ok: #1F6B4A;
    --warn: #A07818;
    --danger: #A93B3B;
    --danger-soft: #F3E0E0;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    --f-mono: "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    line-height: 1.6;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: var(--ground);
    display: flex;
    flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    gap: 16px;
  }
  header.bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
  .logo::before { content: "¥ "; color: var(--brand); font-family: var(--f-mono); font-weight: 700; }
  .month { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mid); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }

  /* hero */
  .hero { text-align: center; padding: 30px 20px 24px; }
  .hero .label { font-size: 13px; color: var(--ink-mid); letter-spacing: 0.08em; }
  .amount {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(40px, 12vw, 52px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 4px 0 2px;
    color: var(--ok);
    transition: color .3s;
  }
  .amount.warn { color: var(--warn); }
  .amount.danger { color: var(--danger); }
  .perday { font-size: 14px; color: var(--ink-mid); }
  .perday b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
  .gauge { height: 8px; border-radius: 4px; background: var(--brand-soft); margin-top: 18px; overflow: hidden; }
  .gauge > div { height: 100%; border-radius: 4px; background: var(--brand); transition: width .4s, background .3s; }
  .gauge.warn > div { background: var(--warn); }
  .gauge.danger > div { background: var(--danger); }
  .gauge-cap { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--ink-mid); margin-top: 6px; }

  /* keypad */
  .entry-amount {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 32px;
    font-weight: 500;
    text-align: right;
    padding: 4px 8px 10px;
    border-bottom: 2px solid var(--line);
    min-height: 52px;
  }
  .entry-amount .ph { color: var(--line); }
  .keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .keys button {
    font-family: var(--f-mono);
    font-size: 22px;
    padding: 14px 0;
    border: none;
    border-radius: 12px;
    background: var(--ground);
    color: var(--ink);
    cursor: pointer;
  }
  .keys button:active { background: var(--brand-soft); }
  .keys .del { font-size: 18px; color: var(--ink-mid); }
  .submit {
    width: 100%;
    margin-top: 12px;
    padding: 15px 0;
    font-family: var(--f-body);
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--brand);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .submit:disabled { opacity: .35; }
  .submit:active:not(:disabled) { transform: translateY(1px); }

  /* today list */
  .sec-title { font-size: 13px; color: var(--ink-mid); letter-spacing: 0.06em; margin: 2px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .sec-title .sum { font-family: var(--f-mono); }
  ul.spends { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ul.spends li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  ul.spends li:last-child { border-bottom: none; }
  ul.spends .t { color: var(--ink-mid); font-family: var(--f-mono); font-size: 12px; }
  ul.spends .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  ul.spends button {
    border: none; background: none; color: var(--danger); font-size: 12px; cursor: pointer; padding: 4px 6px;
  }
  .empty { color: var(--ink-mid); font-size: 13px; text-align: center; padding: 14px 0; }

  footer.note { text-align: center; font-size: 11.5px; color: var(--ink-mid); padding-bottom: 8px; }
  footer.note button { border: none; background: none; color: var(--brand); cursor: pointer; font-size: 11.5px; text-decoration: underline; }

  /* onboarding */
  .onb { display: flex; flex-direction: column; gap: 18px; justify-content: center; flex: 1; padding-bottom: 10vh; }
  .onb h1 { font-size: 24px; margin: 0; line-height: 1.5; }
  .onb p { margin: 0; color: var(--ink-mid); font-size: 14.5px; }
  .onb .budget-in {
    font-family: var(--f-mono);
    font-size: 34px;
    width: 100%;
    padding: 10px 6px;
    border: none;
    border-bottom: 2px solid var(--brand);
    background: none;
    text-align: right;
    color: var(--ink);
  }
  .onb .budget-in:focus { outline: none; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button {
    font-family: var(--f-mono); font-size: 14px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink);
  }
  .presets button:active { background: var(--brand-soft); }
  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; font-size: 13px;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: all .3s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="phone">

  <!-- onboarding -->
  <div class="onb" id="onb">
    <h1>今月、変動費に<br>いくら使えますか？</h1>
    <p>食費・日用品・趣味など、毎月変動する支出の予算をひとつだけ決めます。あとはこのアプリが「あといくら使えるか」だけを教えます。</p>
    <input class="budget-in" id="budgetIn" type="number" inputmode="numeric" placeholder="60000">
    <div class="presets">
      <button data-v="30000">¥30,000</button>
      <button data-v="50000">¥50,000</button>
      <button data-v="60000">¥60,000</button>
      <button data-v="80000">¥80,000</button>
      <button data-v="100000">¥100,000</button>
    </div>
    <button class="submit" id="startBtn">この予算ではじめる</button>
  </div>

  <!-- main -->
  <div id="main" class="hidden" style="display:flex; flex-direction:column; gap:16px;">
    <header class="bar">
      <span class="logo">あといくら</span>
      <span class="month" id="monthLabel"></span>
    </header>

    <div class="card hero">
      <div class="label">今月あと</div>
      <div class="amount" id="remain">¥0</div>
      <div class="perday">1日あたり <b id="perday">¥0</b> 使えます</div>
      <div class="gauge" id="gauge"><div id="gaugeFill" style="width:100%"></div></div>
      <div class="gauge-cap"><span id="usedLabel"></span><span id="budgetLabel"></span></div>
    </div>

    <div class="card">
      <div class="entry-amount" id="entry"><span class="ph">使った金額</span></div>
      <div class="keys" id="keys">
        <button>7</button><button>8</button><button>9</button>
        <button>4</button><button>5</button><button>6</button>
        <button>1</button><button>2</button><button>3</button>
        <button>00</button><button>0</button><button class="del">⌫</button>
      </div>
      <button class="submit" id="addBtn" disabled>記録する</button>
    </div>

    <div>
      <div class="sec-title"><span>今日の記録</span><span class="sum" id="todaySum"></span></div>
      <div class="card" style="padding: 8px 16px;">
        <ul class="spends" id="todayList"></ul>
        <div class="empty hidden" id="todayEmpty">今日はまだ記録がありません</div>
      </div>
    </div>

    <footer class="note">
      予算 <span id="footBudget"></span> ／ <button id="resetBtn">予算を変更する</button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  const KEY = "atoikura_v1";
  const $ = id => document.getElementById(id);
  const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

  function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  let state = load();
  const now = new Date();

  // month rollover: keep budget, clear spends
  if (state && state.month !== monthKey(now)) {
    state.month = monthKey(now);
    state.spends = [];
    save(state);
  }

  function daysLeftInMonth(d) {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return last - d.getDate() + 1;
  }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 1800);
  }

  /* ---------- onboarding ---------- */
  document.querySelectorAll(".presets button").forEach(b => {
    b.addEventListener("click", () => { $("budgetIn").value = b.dataset.v; });
  });
  $("startBtn").addEventListener("click", () => {
    const v = parseInt($("budgetIn").value, 10);
    if (!v || v < 1000) { showToast("1,000円以上で設定してください"); return; }
    state = { budget: v, month: monthKey(new Date()), spends: [] };
    save(state);
    boot();
  });

  /* ---------- keypad ---------- */
  let buf = "";
  function renderEntry() {
    const e = $("entry");
    if (!buf) { e.innerHTML = '<span class="ph">使った金額</span>'; }
    else { e.textContent = yen(parseInt(buf, 10)); }
    $("addBtn").disabled = !buf || parseInt(buf, 10) === 0;
  }
  $("keys").addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.classList.contains("del")) { buf = buf.slice(0, -1); }
    else {
      if (buf.length >= 7) return;
      buf += b.textContent;
      buf = String(parseInt(buf, 10) || "");
    }
    renderEntry();
  });
  $("addBtn").addEventListener("click", () => {
    const v = parseInt(buf, 10);
    if (!v) return;
    state.spends.push({ v: v, ts: Date.now() });
    save(state);
    buf = "";
    renderEntry();
    render();
    showToast(yen(v) + " を記録しました");
  });

  /* ---------- render ---------- */
  function isToday(ts) {
    const d = new Date(ts), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function render() {
    const used = state.spends.reduce((a, s) => a + s.v, 0);
    const remain = state.budget - used;
    const ratio = Math.max(0, remain / state.budget);
    const am = $("remain");
    am.textContent = yen(remain);
    am.className = "amount" + (ratio < 0.15 || remain < 0 ? " danger" : ratio < 0.4 ? " warn" : "");
    const g = $("gauge");
    g.className = "gauge" + (ratio < 0.15 || remain < 0 ? " danger" : ratio < 0.4 ? " warn" : "");
    $("gaugeFill").style.width = (Math.max(0, Math.min(1, ratio)) * 100) + "%";
    $("perday").textContent = yen(Math.max(0, remain) / daysLeftInMonth(new Date()));
    $("usedLabel").textContent = "使用 " + yen(used);
    $("budgetLabel").textContent = "予算 " + yen(state.budget);
    $("footBudget").textContent = yen(state.budget) + "／月";
    const n = new Date();
    $("monthLabel").textContent = n.getFullYear() + "年" + (n.getMonth() + 1) + "月";

    // today list
    const todays = state.spends.filter(s => isToday(s.ts)).slice().reverse();
    const ul = $("todayList");
    ul.innerHTML = "";
    todays.forEach(s => {
      const li = document.createElement("li");
      const d = new Date(s.ts);
      const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      li.innerHTML = '<span class="t">' + hm + '</span><span style="flex:1"></span><span class="v">' + yen(s.v) + '</span>';
      const del = document.createElement("button");
      del.textContent = "取消";
      del.addEventListener("click", () => {
        state.spends = state.spends.filter(x => x !== s);
        save(state);
        render();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
    $("todayEmpty").classList.toggle("hidden", todays.length > 0);
    $("todaySum").textContent = todays.length ? "計 " + yen(todays.reduce((a, s) => a + s.v, 0)) : "";
  }

  $("resetBtn").addEventListener("click", () => {
    if (confirm("予算を設定し直しますか？（今月の記録は残ります）")) {
      $("budgetIn").value = state.budget;
      $("onb").classList.remove("hidden");
      $("main").classList.add("hidden");
    }
  });

  function boot() {
    if (state && state.budget) {
      $("onb").classList.add("hidden");
      $("main").classList.remove("hidden");
      render();
    } else {
      $("onb").classList.remove("hidden");
      $("main").classList.add("hidden");
    }
  }
  boot();
})();
</script>
</body>
</html>
