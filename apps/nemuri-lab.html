<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ねむり実験室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #101423;
    --surface: #1A1F33;
    --surface-2: #232A44;
    --ink: #E9EBF5;
    --ink-mid: #9AA2C0;
    --line: #2E3653;
    --moon: #C9B8F5;
    --moon-deep: #A98FE8;
    --moon-soft: #2A2547;
    --star: #E8C87A;
    --good: #8FD3B0;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
    --f-mono: "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    line-height: 1.7;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    gap: 16px;
  }
  header.bar { display: flex; align-items: baseline; justify-content: space-between; }
  .logo { font-weight: 700; font-size: 17px; }
  .logo::before { content: "◐ "; color: var(--moon); }
  .date { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mid); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
  }
  .kicker { font-size: 11.5px; letter-spacing: 0.16em; color: var(--moon); font-weight: 700; }
  .exp-name { font-size: 22px; font-weight: 700; line-height: 1.45; margin: 6px 0 4px; text-wrap: balance; }
  .exp-desc { font-size: 13.5px; color: var(--ink-mid); margin: 0; }
  .exp-day { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mid); margin-top: 12px; }
  .dots { display: flex; gap: 5px; margin-top: 6px; }
  .dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .dots i.did { background: var(--moon); }
  .dots i.pass { background: var(--line); }

  .btn {
    width: 100%;
    padding: 15px 0;
    font-family: var(--f-body);
    font-size: 15.5px;
    font-weight: 700;
    border-radius: 14px;
    border: none;
    cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn-moon { background: var(--moon); color: #191430; }
  .btn-moon:active { background: var(--moon-deep); }
  .btn-ghost { background: none; color: var(--ink-mid); border: 1px solid var(--line); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* morning rating */
  .faces { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .faces button {
    flex: 1;
    aspect-ratio: 1;
    max-height: 68px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    font-size: 22px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--ink);
  }
  .faces button small { font-size: 9.5px; color: var(--ink-mid); }
  .faces button.on { background: var(--moon-soft); border-color: var(--moon); }
  .done-msg { text-align: center; color: var(--good); font-size: 14px; font-weight: 700; padding: 6px 0 0; }

  /* report */
  .sec-title { font-size: 13px; color: var(--ink-mid); letter-spacing: 0.06em; margin: 2px 2px 8px; }
  .rep-row { padding: 13px 2px; border-bottom: 1px solid var(--line); }
  .rep-row:last-child { border-bottom: none; }
  .rep-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
  .delta { font-family: var(--f-mono); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .delta.up { color: var(--good); }
  .delta.flat { color: var(--ink-mid); }
  .rep-sub { font-size: 11.5px; color: var(--ink-mid); font-family: var(--f-mono); }
  .verdict {
    margin-top: 4px;
    background: var(--surface-2);
    border-left: 3px solid var(--moon);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    font-size: 13.5px;
  }
  .empty { color: var(--ink-mid); font-size: 13px; text-align: center; padding: 16px 0; }

  .tabs {
    display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px;
  }
  .tabs button {
    flex: 1; border: none; background: none; border-radius: 999px;
    font-family: var(--f-body); font-size: 13.5px; font-weight: 500; padding: 9px 0;
    color: var(--ink-mid); cursor: pointer;
  }
  .tabs button.on { background: var(--moon); color: #191430; font-weight: 700; }

  /* experiment picker */
  .pick-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    background: var(--surface-2);
    margin-bottom: 10px;
    cursor: pointer;
  }
  .pick-card.on { border-color: var(--moon); background: var(--moon-soft); }
  .pick-card .n { font-weight: 700; font-size: 14.5px; }
  .pick-card .d { font-size: 12.5px; color: var(--ink-mid); }

  .onb { display: flex; flex-direction: column; gap: 18px; justify-content: center; flex: 1; padding-bottom: 8vh; }
  .onb h1 { font-size: 25px; margin: 0; line-height: 1.55; }
  .onb h1 span { color: var(--moon); }
  .onb p { margin: 0; color: var(--ink-mid); font-size: 14.5px; }
  .hidden { display: none !important; }
  footer.note { text-align: center; font-size: 11.5px; color: var(--ink-mid); padding-bottom: 8px; }
  footer.note button { border: none; background: none; color: var(--moon); cursor: pointer; font-size: 11.5px; text-decoration: underline; }
</style>
</head>
<body>
<div class="phone">

  <!-- onboarding -->
  <div class="onb" id="onb">
    <h1>睡眠を測るのは、<br>もうやめましょう。<br><span>今夜から実験です。</span></h1>
    <p>毎晩ひとつの習慣を試し、朝の疲労感をワンタップで記録。2週間で「あなたに本当に効く習慣」をデータで特定します。</p>
    <div>
      <div class="sec-title" style="margin-bottom:10px;">最初の実験を選んでください</div>
      <div id="pickList"></div>
    </div>
    <button class="btn btn-moon" id="startBtn">この実験をはじめる</button>
  </div>

  <!-- main -->
  <div id="main" class="hidden" style="display:flex; flex-direction:column; gap:16px;">
    <header class="bar">
      <span class="logo">ねむり実験室</span>
      <span class="date" id="dateLabel"></span>
    </header>

    <div class="tabs">
      <button class="on" data-tab="today">こんや</button>
      <button data-tab="rep">けっか</button>
    </div>

    <div id="tab-today" style="display:flex; flex-direction:column; gap:14px;">

      <!-- morning check -->
      <div class="card" id="morningCard">
        <div class="kicker">あさの記録</div>
        <div class="exp-name" style="font-size:18px;">目覚めた感じは？</div>
        <div class="faces" id="faces">
          <button data-v="1">😵<small>ヘトヘト</small></button>
          <button data-v="2">😞<small>だるい</small></button>
          <button data-v="3">😐<small>ふつう</small></button>
          <button data-v="4">🙂<small>わりと良い</small></button>
          <button data-v="5">😃<small>スッキリ</small></button>
        </div>
        <div class="done-msg hidden" id="morningDone">記録しました。今日もおつかれさまです。</div>
      </div>

      <!-- tonight's experiment -->
      <div class="card">
        <div class="kicker">こんやの実験 <span id="expDayNo" style="color:var(--ink-mid)"></span></div>
        <div class="exp-name" id="expName"></div>
        <p class="exp-desc" id="expDesc"></p>
        <div class="exp-day" id="expProgressLabel"></div>
        <div class="dots" id="expDots"></div>
        <div class="row2" style="margin-top:16px;">
          <button class="btn btn-moon" id="didBtn">やる</button>
          <button class="btn btn-ghost" id="passBtn">今日はパス</button>
        </div>
        <div class="done-msg hidden" id="nightDone"></div>
      </div>
    </div>

    <div id="tab-rep" class="hidden" style="flex-direction:column; gap:14px;">
      <div class="sec-title">実験ごとの結果（朝の疲労感 5段階の平均）</div>
      <div class="card" style="padding:10px 18px;">
        <div id="repList"></div>
        <div class="empty hidden" id="repEmpty">記録がたまると、ここに結果が出ます</div>
      </div>
      <div class="verdict hidden" id="verdict"></div>
      <button class="btn btn-ghost" id="demoBtn">デモデータで結果画面を見てみる</button>
      <button class="btn btn-ghost" id="switchBtn">別の実験に切り替える</button>
    </div>

    <footer class="note">
      叩き台バージョン ／ 医療的な診断・治療を目的としたものではありません ／ <button id="resetBtn">最初からやり直す</button>
    </footer>
  </div>
</div>

<script>
(function () {
  const KEY = "nemurilab_v1";
  const $ = id => document.getElementById(id);

  const EXPS = [
    { id: "bath90", n: "寝る90分前に入浴する", d: "深部体温が下がるタイミングで眠気が来ます。今夜はベッドの90分前までにお風呂を済ませます。" },
    { id: "caffeine14", n: "カフェインは14時まで", d: "コーヒー・緑茶・エナジードリンクを14時以降やめてみます。" },
    { id: "phone30", n: "寝る30分前にスマホを手放す", d: "ベッドにスマホを持ち込まず、充電器は部屋の反対側へ。" },
    { id: "wake-fix", n: "起きる時刻を毎日そろえる", d: "休日もふくめて起床時刻を±30分以内にそろえます。" },
    { id: "no-alcohol", n: "今夜はお酒を飲まない", d: "寝つきは良くなっても眠りは浅くなります。今夜は休肝日に。" },
    { id: "stretch5", n: "寝る前に5分ストレッチ", d: "首・肩・背中をゆっくり伸ばして副交感神経に切り替えます。" },
  ];

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  let state = load();

  function todayStr(offsetDays) {
    const d = new Date();
    if (offsetDays) d.setDate(d.getDate() + offsetDays);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  /* ---------- onboarding picker ---------- */
  let pickedId = EXPS[0].id;
  function renderPicker() {
    const wrapEl = $("pickList");
    wrapEl.innerHTML = "";
    EXPS.slice(0, 4).forEach(e => {
      const div = document.createElement("div");
      div.className = "pick-card" + (e.id === pickedId ? " on" : "");
      div.innerHTML = '<div class="n">' + e.n + '</div><div class="d">' + e.d + "</div>";
      div.addEventListener("click", () => { pickedId = e.id; renderPicker(); });
      wrapEl.appendChild(div);
    });
  }

  $("startBtn").addEventListener("click", () => {
    state = { activeExp: pickedId, startDate: todayStr(), nights: [], mornings: [] };
    save(state);
    boot();
  });

  /* ---------- today ---------- */
  function expById(id) { return EXPS.find(e => e.id === id) || EXPS[0]; }

  function renderToday() {
    const exp = expById(state.activeExp);
    $("expName").textContent = exp.n;
    $("expDesc").textContent = exp.d;

    const nightsForExp = state.nights.filter(x => x.exp === exp.id);
    const dayNo = nightsForExp.length + 1;
    $("expDayNo").textContent = "── " + Math.min(dayNo, 14) + "日目 / 14日";
    $("expProgressLabel").textContent = "実験の進みぐあい";
    const dots = $("expDots");
    dots.innerHTML = "";
    for (let i = 0; i < 14; i++) {
      const el = document.createElement("i");
      const rec = nightsForExp[i];
      if (rec) el.className = rec.did ? "did" : "pass";
      dots.appendChild(el);
    }

    // tonight already answered?
    const tonight = state.nights.find(x => x.date === todayStr());
    const nd = $("nightDone");
    if (tonight) {
      nd.textContent = tonight.did ? "今夜は「やる」を選びました。おやすみなさい。" : "今日はパス。無理しないのも実験のうちです。";
      nd.classList.remove("hidden");
      $("didBtn").disabled = true;
      $("passBtn").disabled = true;
      $("didBtn").style.opacity = $("passBtn").style.opacity = .4;
    } else {
      nd.classList.add("hidden");
      $("didBtn").disabled = false;
      $("passBtn").disabled = false;
      $("didBtn").style.opacity = $("passBtn").style.opacity = 1;
    }

    // morning already rated?
    const rated = state.mornings.find(m => m.date === todayStr());
    document.querySelectorAll("#faces button").forEach(b => {
      b.classList.toggle("on", !!rated && String(rated.v) === b.dataset.v);
    });
    $("morningDone").classList.toggle("hidden", !rated);
  }

  function answerNight(did) {
    if (state.nights.find(x => x.date === todayStr())) return;
    state.nights.push({ date: todayStr(), exp: state.activeExp, did: did });
    save(state);
    renderToday();
    renderReport();
  }
  $("didBtn").addEventListener("click", () => answerNight(true));
  $("passBtn").addEventListener("click", () => answerNight(false));

  $("faces").addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    const v = parseInt(b.dataset.v, 10);
    const ex = state.mornings.find(m => m.date === todayStr());
    if (ex) ex.v = v;
    else state.mornings.push({ date: todayStr(), v: v });
    save(state);
    renderToday();
    renderReport();
  });

  /* ---------- report ----------
     朝の評価は「前夜の実験をやった翌朝」に紐づける */
  function prevDate(dateStr) {
    const d = new Date(dateStr + "T12:00:00");
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function computeStats() {
    const stats = {};
    EXPS.forEach(e => { stats[e.id] = { did: [], base: [] }; });
    state.mornings.forEach(m => {
      const night = state.nights.find(n => n.date === prevDate(m.date));
      if (night) {
        if (night.did) stats[night.exp].did.push(m.v);
        else stats[night.exp].base.push(m.v);
      }
    });
    return stats;
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

  function renderReport() {
    const stats = computeStats();
    const wrapEl = $("repList");
    wrapEl.innerHTML = "";
    let any = false;
    let best = null;
    EXPS.forEach(e => {
      const s = stats[e.id];
      const aDid = avg(s.did), aBase = avg(s.base);
      if (aDid === null && aBase === null) return;
      any = true;
      const row = document.createElement("div");
      row.className = "rep-row";
      let deltaHtml = "";
      if (aDid !== null && aBase !== null) {
        const d = aDid - aBase;
        deltaHtml = '<span class="delta ' + (d > 0.2 ? "up" : "flat") + '">' + (d >= 0 ? "+" : "") + d.toFixed(1) + "</span>";
        if (d > 0.2 && (!best || d > best.d)) best = { n: e.n, d: d };
      } else if (aDid !== null) {
        deltaHtml = '<span class="delta flat">実施時 ' + aDid.toFixed(1) + "</span>";
      } else {
        deltaHtml = '<span class="delta flat">未実施 ' + aBase.toFixed(1) + "</span>";
      }
      row.innerHTML = '<div class="rep-head"><span>' + e.n + "</span>" + deltaHtml + "</div>" +
        '<div class="rep-sub">やった夜の翌朝 ' + (aDid !== null ? aDid.toFixed(1) + "点 (" + s.did.length + "晩)" : "—") +
        " ／ やらなかった夜 " + (aBase !== null ? aBase.toFixed(1) + "点 (" + s.base.length + "晩)" : "—") + "</div>";
      wrapEl.appendChild(row);
    });
    $("repEmpty").classList.toggle("hidden", any);
    const v = $("verdict");
    if (best) {
      v.textContent = "いまのところ、あなたに最も効いているのは「" + best.n + "」。実施した夜の翌朝は平均 " + best.d.toFixed(1) + " 点スッキリしています。";
      v.classList.remove("hidden");
    } else {
      v.classList.add("hidden");
    }
  }

  /* ---------- demo data ---------- */
  $("demoBtn").addEventListener("click", () => {
    if (!confirm("14日ぶんのデモデータを追加します。よろしいですか？（自分の記録は消えません）")) return;
    const exp = state.activeExp;
    for (let i = 15; i >= 2; i--) {
      const nd = todayStr(-i);
      const md = todayStr(-i + 1);
      const did = i % 2 === 0;
      if (!state.nights.find(x => x.date === nd)) state.nights.push({ date: nd, exp: exp, did: did });
      if (!state.mornings.find(x => x.date === md)) {
        const v = did ? 3 + (i % 3 === 0 ? 2 : 1) : 2 + (i % 4 === 0 ? 1 : 0);
        state.mornings.push({ date: md, v: Math.min(5, v) });
      }
    }
    save(state);
    renderToday();
    renderReport();
  });

  /* ---------- switch experiment ---------- */
  $("switchBtn").addEventListener("click", () => {
    const idx = EXPS.findIndex(e => e.id === state.activeExp);
    const next = EXPS[(idx + 1) % EXPS.length];
    if (confirm("実験を「" + next.n + "」に切り替えますか？（これまでの記録は残ります）")) {
      state.activeExp = next.id;
      save(state);
      renderToday();
    }
  });

  $("resetBtn").addEventListener("click", () => {
    if (confirm("すべての記録を消して最初からやり直しますか？")) {
      localStorage.removeItem(KEY);
      state = null;
      boot();
    }
  });

  document.querySelectorAll(".tabs button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      ["today", "rep"].forEach(t => {
        const el = $("tab-" + t);
        const on = b.dataset.tab === t;
        el.classList.toggle("hidden", !on);
        if (on) el.style.display = "flex";
      });
    });
  });

  function boot() {
    const n = new Date();
    $("dateLabel").textContent = (n.getMonth() + 1) + "/" + n.getDate();
    if (state && state.activeExp) {
      $("onb").classList.add("hidden");
      $("main").classList.remove("hidden");
      renderToday();
      renderReport();
    } else {
      renderPicker();
      $("onb").classList.remove("hidden");
      $("main").classList.add("hidden");
    }
  }
  boot();
})();
</script>
</body>
</html>
