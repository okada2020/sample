<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3f4">
<title>フルーツ転倒RTA</title>
<meta name="description" content="果物を背負った少年が坂を駆け下りる。転んでばらまいた果物はゲートで増え、道をふさぐ動物を蹴散らす。ゴールまでのタイムを competing する転倒RTA。">
<style>
  :root{ --ink:#1b1b1f; --accent:#ffb020; --panel:rgba(20,22,28,.86); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1418;}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
       color:#fff;user-select:none;touch-action:none;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;max-width:820px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5);}
  canvas{display:block;width:100%;height:100%;}

  #hud{position:absolute;inset:0;pointer-events:none;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .chip{background:var(--panel);border:3px solid #000;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px;
        box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap;}
  #stock{font-size:21px;color:var(--accent);}
  #timer{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));
         font-size:34px;font-weight:900;letter-spacing:.02em;text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.6);
         font-variant-numeric:tabular-nums;}
  #progress{position:absolute;left:14px;right:14px;top:calc(62px + env(safe-area-inset-top));height:10px;
            border:3px solid #000;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#8de36b,#ffd166);}
  #hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
        font-size:14px;font-weight:700;opacity:.9;text-shadow:0 2px 4px #000;}

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(120% 90% at 50% 20%,rgba(10,20,26,.5),rgba(6,12,16,.9));padding:22px;}
  #overlay.hidden{display:none;}
  .card{width:min(420px,100%);background:#fffdf5;color:#1b1b1f;border:5px solid #000;border-radius:24px;
        padding:24px 20px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.45);}
  .card h1{margin:0 0 4px;font-size:30px;line-height:1.25;}
  .card h1 small{display:block;font-size:12px;font-weight:800;letter-spacing:.2em;opacity:.55;margin-top:6px;}
  .card h2{margin:0 0 8px;font-size:24px;}
  .card p{margin:8px 0;font-size:14px;line-height:1.8;}
  .time{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;margin:4px 0;}
  .best{font-size:13px;font-weight:800;opacity:.7;}
  .rules{text-align:left;font-size:13.5px;line-height:1.95;margin:12px auto 2px;max-width:310px;}
  .rules b{color:#c8471f;}
  button{pointer-events:auto;margin-top:16px;width:100%;padding:14px 20px;font-size:18px;font-weight:900;
         font-family:inherit;color:#1b1b1f;border:4px solid #000;border-radius:16px;
         background:linear-gradient(180deg,#ffd76a,#ffb020);cursor:pointer;box-shadow:0 6px 0 #000;transition:transform .07s,box-shadow .07s;}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #000;}
  .tag{display:inline-block;background:#1b1b1f;color:#fff;border-radius:99px;padding:4px 14px;font-size:12px;font-weight:900;letter-spacing:.1em;margin-bottom:8px;}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="row">
      <div class="chip">🍎 <span id="stock">0</span></div>
      <div class="chip">BEST <span id="best">--:--</span></div>
    </div>
    <div id="timer">0.00</div>
    <div id="progress"><div id="bar"></div></div>
    <div id="hint">タップで転ぶ／ドラッグで左右</div>
  </div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div></div>
<script src="game.js"></script>
</body>
</html>
