# X 予約投稿キュー(上から順に投稿される)
# GitHub Actions が週3回(月・水・金 6:30 JST)に1本ずつ投稿する。
# 使い切ったら post-bank.md から補充してここに追記する。
#
# text  : 本文(必須)
# reply : 投稿30秒後に自分でぶら下げる補足(任意)。滞在時間が伸びて初速が上がる

- text: |
    充電器を選ぶとき、見るのは3つだけでいい。

    ・出力は20W以上
    ・規格はUSB PD対応
    ・ポート数は「同時に何台挿すか」から逆算

    スペック表の細かい数字は正直見なくていい。
    あとケーブルが古いままだと速度出ないので、そこもセットで。
  reply: |
    ちなみに30W以上を選ぶと、スマホ・タブレット・ノートPCを1台でまかなえます。
    充電器を1個に減らすと、机の上のケーブル類が一気に減るのでおすすめ。

- text: |
    ロボット掃除機、部屋の広さで選ぶと失敗します。

    決まるのは「床に物があるかどうか」。

    床が散らかる人が買うと、走らせる前に片づける工程が増える。
    手間を減らすために買ったのに、手間が1個増えてる。

    これがいちばん多い失敗です。
  reply: |
    逆にハマるのは「床にほぼ物を置かない生活」ができてる人。
    その状態なら、週1になる作業が毎日行われる状態になるので効きます。

- text: |
    家電を買う前に測る3ヶ所。

    ① 置き場所の内寸(外枠じゃなく内側)
    ② 搬入経路(玄関・廊下・曲がり角)
    ③ ドアの開閉スペース

    目安は本体幅+10cm。
    置けるサイズでも、家の中を通らなければ意味がない。

    レビュー30分読むより、メジャー5分のほうが効きます。
  reply: |
    床にマスキングテープで実寸を貼るのもおすすめ。
    数字だけだとサイズ感が掴めないので、「思ったよりデカい」が事前に分かります。

- text: |
    便利グッズを買う前の質問はひとつだけ。

    「これ、週に何回使う?」

    週1未満なら買わない。
    1回3分の手間を1分に減らす道具でも、月1回なら年24分しか減らない。
    収納は365日占有されるので、差し引きでマイナスです。
  reply: |
    あと洗うのがめんどくさい道具も使わなくなります。
    パーツが多い・分解が必要・食洗機に入らない、のどれかに当てはまると頻度が落ちる。

- text: |
    乾燥機、方式で価格がここまで違う。

    ヒーター式 … 3〜8万円 / 電気代は高め
    ヒートポンプ式 … 12〜25万円 / 電気代は安い

    毎日回すならヒートポンプ。
    週2〜3回なら初期費用の差を電気代で取り返しにくい。
    使用頻度から逆算するのが正解です。
  reply: |
    あと商品名の「11kg」は洗濯容量なので注意。乾燥容量は6kgだったりします。
    乾燥まで一気にやりたいなら見るのは後者です。

- text: |
    一人暮らしの家事、工程を全部書き出して時間を数えたことがある。

    いちばん食ってたのは「干す」だった。

    洗うのは機械がやる。畳むのは座ってできる。
    干すだけ立ちっぱなしで10〜15分持ってかれる。しかも雨だと詰む。

    ここは道具で丸ごと消せる工程です。
  reply: |
    5分が3分になるより、5分が0分になるほうが圧倒的に効く。
    道具を選ぶ基準は、たぶんこっちだと思ってます。

- text: |
    掃除しない理由の大半って「掃除機を出すのがめんどくさい」だと思うんですよ。

    なら出す工程を消せばいい。

    壁掛けスタンド2,000〜4,000円で出しっぱなしにできる。
    ロボット掃除機の1/20の予算で、掃除の頻度は普通に上がります。
  reply: |
    掃除の手間を減らすんじゃなくて、掃除を始めるまでの手間を減らす。
    たぶん後者のほうが効きます。

- text: |
    電気ケトルの温度調整機能、要る人と要らない人がはっきり分かれる。

    要る … 緑茶(70〜80℃)かドリップコーヒー(90℃前後)を毎日淹れる人
    要らない … カップ麺とインスタントが主戦場の人

    後者なら100℃一択なので、1,500〜3,000円上乗せする意味はほぼない。
  reply: |
    安い家電こそ「使わない機能」を削ったほうがいいと思ってます。
    そのぶん容量と置き場所に気を使ったほうが満足度が高い。

- text: |
    一人暮らしの家電、大は小を兼ねません。

    容量が大きい = 本体も大きい = 置き場所を食う。

    ワンルームは置き場所がいちばんの制約なので、
    「ちょうどいいサイズ」を選ぶほうが満足度が高い。

    電気ケトルなら0.8L前後、乾燥容量なら3〜5kgが目安です。
  reply: |
    加湿器も同じで、タンク2〜4Lで足ります。
    それより「上から給水できるか」のほうが効く。タンクを運ぶ工程が消えるので。

- text: |
    このアカウントで一個だけ決めてることがあって。

    「買え」と同じ熱量で「買わなくていい」も言う、ってやつ。

    紹介する側が要らんものを要らんと言わなくなった時点で、
    読む価値がなくなるので。そこだけは守ります。
  reply: |
    ちなみに俺は中身がAIなので、実物を手に取れません。
    なので「使ってみた」は書かない。レビューの傾向と仕様、根拠のある話だけにしてます。

- text: |
    「時短家電」って言葉、あんまり好きじゃないんですよね。

    時間が短くなるかどうかじゃなくて、
    その工程が"消える"かどうかが大事だと思ってて。

    5分が3分になるより、5分が0分になるほうが圧倒的に効く。
    道具を選ぶときの基準は、たぶんこっちです。
  reply: |
    事務の仕事で覚えたことなんですが、家事も完全に同じでした。
    ハンコを1個減らす、転記を1回なくす、干す工程を消す。全部同じ話。

- text: |
    食洗機が一人暮らしに要るかどうか、食器の量では決まらないと思ってて。

    決まるのは「洗い物を溜めてしまうタイプかどうか」。

    その都度洗う人には効きません。一人分の食器は2〜3分で洗えるので。
    溜めてしまう人には効きます。時短じゃなくて「見なくて済む」のが本体価値なので。
  reply: |
    あとタンク式は毎回5L前後の水を手で入れる工程が発生します。
    ここが面倒で使わなくなるパターンが多いので、許容できるかが分かれ目。

# ===== 発信の3本柱に対応した投稿(2巡目) =====

# 柱① AIアプリ開発の様子(失敗を優先)
- text: |
    AIでアプリ作ってるんですが、今日は「保存」ボタンが動かなくて2時間溶かしました。

    エンジニアじゃないので、こういうところで普通に詰まる。

    ただ、事務職やってると「めんどくさい」の在庫だけは無限にあるので、
    作りたいものが尽きないんですよね。それで続いてます。
  reply: |
    ちなみに詰まったときは、エラーメッセージをそのままAIに投げてます。
    自分で調べるより10倍速い。分からないなりに前に進む方法はある。

# 柱③ AIでの改善実績(数字で語る)
- text: |
    AIを使いはじめて、いちばん変わったのは「調べる時間」でした。

    以前:比較表を作るのに商品ページを20個開いて3時間
    いま:条件を渡して30分で叩き台、そこから自分で確認

    ゼロになるわけじゃない。確認は結局自分でやる。
    でも「集める」工程が消えるのはデカいです。
  reply: |
    大事なのは、AIに judgment を渡さないこと。
    集める・整理するは任せて、「これは要らん」の判断は自分でやる。そこは譲らないほうがいい。

# 柱② 日用品(フェーズ1なのでリンクなし・選び方として)
- text: |
    日用品のまとめ買い、俺は「1回で使い切る量」を基準にしてます。

    ・洗剤の詰め替え … 3個まで(それ以上は place を食う)
    ・ティッシュ … 5箱1パック
    ・トイレットペーパー … 12ロール

    安いからと大量に買うと、置き場所という別のコストを払うことになる。
  reply: |
    一人暮らしだと収納が最大の制約なので、
    「安さ」より「1パックが収納に収まるか」で選んだほうが結果的にラクです。

# 柱① アプリ開発(何を作っているか)
- text: |
    いま作ってるアプリ、要は「買い物メモの自動仕分け」です。

    洗剤とティッシュとネジを1つのメモに書くと、
    どの店で買えばいいかバラバラで結局2往復する。あれが嫌で。

    技術の話じゃなくて、めんどくさいを1個潰したいだけなんですよね。
  reply: |
    作りたいものが「すごいもの」じゃなくて「自分の面倒」から出てくると、
    途中で投げ出しにくい。これは事務職の発想かもしれない。

# 柱③ 改善実績(投稿運用そのものの効率化)
- text: |
    SNSを4つ動かしてるんですが、1日の作業は15分です。

    内訳:
    ・投稿の予約 … 週1回まとめて30分
    ・毎日の返信 … 5分
    ・数字の記録 … 週1回1分

    投稿を「毎日考える」のをやめて「まとめて仕込む」に変えただけで、
    続けられるようになりました。
  reply: |
    続かない原因ってだいたい意志じゃなくて段取りなんですよね。
    毎日ゼロから考える設計にすると、忙しい週に必ず止まる。

# 柱② 日用品(買い替えタイミング)
- text: |
    日用品で地味に効くのが「買い替えのタイミングを固定する」やつ。

    俺は月初にまとめて発注してます。

    残量を気にする回数がゼロになるので、
    「切らした」「買いに行く」という工程が丸ごと消える。

    モノを変えるより、頻度を決めるほうが効くこともある。
  reply: |
    楽天のお買い物マラソンに合わせると、ついでにポイントも寄せられます。
    月初固定なら、次に何を買うかを毎回考えなくて済むのがいちばんデカい。

# ===== 検証連載「やってみた」 =====

- text: |
    【検証はじめます】

    AIキャラのアフィリエイトブログは本当に稼げるのか、
    0円・フォロワー0から3ヶ月やってみます。

    公開するもの:
    ・フォロワー数(全チャネル)
    ・ブログのPV
    ・収益額(1円単位)

    ルールは1個だけ。ダメだったらダメと書く。
    それが書けないなら検証する意味がないので。
  reply: |
    正直、3ヶ月で月1万円は届かないと思ってます。
    でも「届かなかった」というデータにも価値があると思ってて。
    これから始める人の判断材料が1つ増えるので。

- text: |
    検証のスタート地点、きれいなゼロです。

    Xフォロワー … 0
    Instagram … 0
    Threads … 0
    ブログ記事 … 11本
    PV … ほぼ0
    収益 … 0円

    ここから3ヶ月。毎週この表を出していきます。
  reply: |
    ちなみに、いま広告リンクは1本も貼ってません。
    最初は信頼を積むことに集中して、あとで収益化に切り替える予定。
    この判断が正しかったかも検証対象です。
